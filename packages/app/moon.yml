$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'

dependsOn:
  - 'shared'

tasks:
  # Vite owns the renderer build, not `tsc -b`. `mergeArgs: replace` is required:
  # moon's default is to APPEND a local task's args to the inherited ones, which
  # would run `pnpm exec tsc -b exec vite build`.
  build:
    # `node --max-old-space-size=4096`, not a bare `pnpm exec vite build`: Node's
    # default old-space cap is ~2 GB on a 64-bit host, and this build peaks at
    # ~3.4 GB RSS since Phase 64 Theme A inlined Monaco's five language workers
    # (`?worker&inline` base64-encodes each into a JS chunk, and Rollup holds every
    # chunk in memory until the end). Without the flag CI's `package` job dies in
    # `transforming...` with "Reached heap limit" — every main run from #164 on.
    # 4 GB clears it with headroom on a 7 GB macos-14 runner. The flag rides on
    # the command rather than a task `env: NODE_OPTIONS`, because an ambient
    # NODE_OPTIONS in the caller's shell wins over moon's task env (verified with
    # `MOON_CACHE=off NODE_OPTIONS=--max-old-space-size=2048`), whereas a CLI flag
    # is applied after NODE_OPTIONS and so always takes effect.
    command: 'node --max-old-space-size=4096 node_modules/vite/bin/vite.js build'
    options:
      mergeArgs: 'replace'
    deps:
      - 'root:install'
      - '^:build'
    inputs:
      - 'src/**/*'
      - 'index.html'
      # See the same entry on `desktop:bundle`: sourcemaps are opt-in as of
      # Phase 36 Theme C, and moon's hash must see the switch or the opt-in is
      # shadowed by the cache.
      - '$MSTUDIO_SOURCEMAP'
      # The treemap switch, for the same reason — `MSTUDIO_BUNDLE_STATS=1` after a
      # prior build would otherwise never write `dist/stats.html`.
      - '$MSTUDIO_BUNDLE_STATS'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
    outputs:
      - 'dist'


  # tsc --noEmit resolves @midnite/studio-shared through a project reference but
  # does not build it, so build it first. Shared's sources are inputs too — see
  # the note in packages/desktop/moon.yml: without them a shared-only change
  # leaves this a cache hit and the typecheck runs against a stale API.
  typecheck:
    deps:
      - 'shared:build'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
      - 'package.json'
      - '/packages/shared/src/**/*'

  # Same reasoning as `typecheck` above: vitest.config.ts aliases
  # @midnite/studio-shared to its source, so shared's sources belong in this
  # task's hash too — otherwise a shared-only change leaves the renderer suite a
  # cache hit and the change ships untested.
  test:
    inputs:
      - 'src/**/*'
      - 'vitest.config.ts'
      - 'package.json'
      - '/packages/shared/src/**/*'

  # Vite dev server for the Electron main process to load in development.
  dev:
    command: 'pnpm exec vite'
    preset: 'server'

  # The performance suite — Phase 36 Theme H. Kept out of `:test` for the same
  # reason as `e2e`, plus a stronger one: a budget failure is a report, and a
  # report that blocks a green build on a busy laptop gets disabled rather than
  # read. `mergeArgs: replace` is mandatory — moon APPENDS a local task's args to
  # the inherited ones otherwise, and this would run `tsc -b exec playwright …`.
  #
  # Depends on `app:build` because two of its three specs read `dist`: the bundle
  # budget parses `.vite/manifest.json`, and the startup budget launches the
  # packaged-equivalent app. `desktop:bundle` is NOT declarable here (it would
  # invert the package dependency direction), so `scripts/perf/electron-run.mjs`
  # refuses to guess and names the command instead.
  perf:
    command: 'pnpm exec playwright test --config playwright.perf.config.ts'
    options:
      mergeArgs: 'replace'
    deps:
      - 'root:install'
      - 'shared:build'
      - 'app:build'
    inputs:
      - 'src/**/*'
      - 'e2e/**/*'
      - 'playwright.perf.config.ts'
      - 'vite.config.ts'
      - '/scripts/perf/**/*'
      - '/packages/shared/src/**/*'

  # What CI blocks on — `e2e` minus the files that were already red when the job
  # was wired up. See playwright.ci.config.ts for why the split exists and
  # `.midnite/tasks/phases/phase-38-e2e-suite-repair.md` for emptying the list.
  # Deliberately NOT the task a human runs: locally you want the whole truth.
  e2e-ci:
    command: 'pnpm exec playwright test --config playwright.ci.config.ts'
    options:
      mergeArgs: 'replace'
    deps:
      - 'root:install'
      - 'shared:build'
    inputs:
      - 'src/**/*'
      - 'e2e/**/*'
      - 'playwright.config.ts'
      - 'playwright.ci.config.ts'
      - 'vite.config.ts'
      - '/packages/shared/src/**/*'

  # Browser-driven renderer tests against a mocked window.midniteStudio. Kept OUT
  # of the `:test` gate deliberately — it needs a chromium download, which is a
  # poor thing to make `moon run :test` depend on. Run it explicitly, or in CI
  # after `playwright install chromium`.
  e2e:
    command: 'pnpm exec playwright test'
    options:
      mergeArgs: 'replace'
    deps:
      - 'root:install'
      - 'shared:build'
    inputs:
      - 'src/**/*'
      - 'e2e/**/*'
      - 'playwright.config.ts'
      - 'vite.config.ts'
      - '/packages/shared/src/**/*'
