$schema: 'https://moonrepo.dev/schemas/project.json'

# Gamer module package (Phase 124 Theme E): the gamer host's compose code, views and main bridge, moved out
# of apps/gamer. Same task shape as a feature package.
id: 'module-gamer'
language: 'typescript'
layer: 'library'

# `app-<id>` names the apps that mount this module: its host and Studio. `scripts/affected-apps.mjs` reads them.
tags:
  - 'layer-module'
  - 'app-gamer'
  - 'app-studio'

dependsOn:
  - 'shared'
  - 'frame'
  - 'runtime'
  - 'feature-report'
  - 'git-engine'
  - 'feature-media-core'
  - 'feature-media-map'
  - 'feature-media-terrain'
  - 'feature-media-sprite'
  - 'feature-media-model'
  - 'feature-media-game'
  - 'feature-media-images'
  - 'feature-models'

tasks:
  # Only the main half emits; the renderer half is compiled by the app.
  build:
    command: 'pnpm exec tsc -b tsconfig.main.json'
    options:
      mergeArgs: 'replace'
    deps:
      - 'root:install'
      - 'shared:build'
      - 'runtime:build'
      - 'feature-report:build'
      - 'git-engine:build'
      - 'feature-media-core:build'
      - 'feature-media-map:build'
      - 'feature-media-terrain:build'
      - 'feature-media-sprite:build'
      - 'feature-media-model:build'
      - 'feature-media-game:build'
      - 'feature-media-images:build'
      - 'feature-models:build'
    inputs:
      - 'main/**/*'
      - 'manifest.ts'
      - 'tsconfig.main.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/git-engine/src/**/*'
      - '/packages/features/media-core/manifest.ts'
      - '/packages/features/media-core/main/**/*'
      - '/packages/features/media-map/manifest.ts'
      - '/packages/features/media-map/main/**/*'
      - '/packages/features/media-terrain/manifest.ts'
      - '/packages/features/media-terrain/main/**/*'
      - '/packages/features/media-sprite/manifest.ts'
      - '/packages/features/media-sprite/main/**/*'
      - '/packages/features/media-model/manifest.ts'
      - '/packages/features/media-model/main/**/*'
      - '/packages/features/media-game/manifest.ts'
      - '/packages/features/media-game/main/**/*'
      - '/packages/features/media-images/manifest.ts'
      - '/packages/features/media-images/main/**/*'
      - '/packages/features/models/manifest.ts'
      - '/packages/features/models/main/**/*'
    outputs:
      - 'dist'

  typecheck:
    command: 'pnpm run typecheck'
    options:
      mergeArgs: 'replace'
    deps:
      - 'shared:build'
      - 'runtime:build'
      - 'feature-report:build'
      - 'git-engine:build'
      - 'feature-media-core:build'
      - 'feature-media-map:build'
      - 'feature-media-terrain:build'
      - 'feature-media-sprite:build'
      - 'feature-media-model:build'
      - 'feature-media-game:build'
      - 'feature-media-images:build'
      - 'feature-models:build'
    inputs:
      - 'renderer/**/*'
      - 'main/**/*'
      - 'manifest.ts'
      - 'manifest.test.ts'
      - 'tsconfig.json'
      - 'tsconfig.main.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/git-engine/src/**/*'
      - '/packages/features/media-core/renderer/**/*'
      - '/packages/features/media-core/manifest.ts'
      - '/packages/features/media-core/main/**/*'
      - '/packages/features/media-map/renderer/**/*'
      - '/packages/features/media-map/manifest.ts'
      - '/packages/features/media-map/main/**/*'
      - '/packages/features/media-terrain/renderer/**/*'
      - '/packages/features/media-terrain/manifest.ts'
      - '/packages/features/media-terrain/main/**/*'
      - '/packages/features/media-sprite/renderer/**/*'
      - '/packages/features/media-sprite/manifest.ts'
      - '/packages/features/media-sprite/main/**/*'
      - '/packages/features/media-model/renderer/**/*'
      - '/packages/features/media-model/manifest.ts'
      - '/packages/features/media-model/main/**/*'
      - '/packages/features/media-game/renderer/**/*'
      - '/packages/features/media-game/manifest.ts'
      - '/packages/features/media-game/main/**/*'
      - '/packages/features/media-images/renderer/**/*'
      - '/packages/features/media-images/manifest.ts'
      - '/packages/features/media-images/main/**/*'
      - '/packages/features/models/renderer/**/*'
      - '/packages/features/models/manifest.ts'
      - '/packages/features/models/main/**/*'

  test:
    inputs:
      - 'renderer/**/*'
      - 'main/**/*'
      - 'manifest.ts'
      - 'manifest.test.ts'
      - 'vitest.config.ts'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/git-engine/src/**/*'
      - '/packages/features/media-core/renderer/**/*'
      - '/packages/features/media-core/manifest.ts'
      - '/packages/features/media-core/main/**/*'
      - '/packages/features/media-map/renderer/**/*'
      - '/packages/features/media-map/manifest.ts'
      - '/packages/features/media-map/main/**/*'
      - '/packages/features/media-terrain/renderer/**/*'
      - '/packages/features/media-terrain/manifest.ts'
      - '/packages/features/media-terrain/main/**/*'
      - '/packages/features/media-sprite/renderer/**/*'
      - '/packages/features/media-sprite/manifest.ts'
      - '/packages/features/media-sprite/main/**/*'
      - '/packages/features/media-model/renderer/**/*'
      - '/packages/features/media-model/manifest.ts'
      - '/packages/features/media-model/main/**/*'
      - '/packages/features/media-game/renderer/**/*'
      - '/packages/features/media-game/manifest.ts'
      - '/packages/features/media-game/main/**/*'
      - '/packages/features/media-images/renderer/**/*'
      - '/packages/features/media-images/manifest.ts'
      - '/packages/features/media-images/main/**/*'
      - '/packages/features/models/renderer/**/*'
      - '/packages/features/models/manifest.ts'
      - '/packages/features/models/main/**/*'

  lint:
    inputs:
      - 'renderer/**/*'
      - 'main/**/*'
      - '*.ts'
      - '/eslint.config.mjs'
