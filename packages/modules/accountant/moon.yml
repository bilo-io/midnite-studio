$schema: 'https://moonrepo.dev/schemas/project.json'

# Accountant module package (Phase 129): the books' nav group, pane and main bridge. Same task shape as a feature package.
id: 'module-accountant'
language: 'typescript'
layer: 'library'

# `app-<id>` names the apps that mount this module (its host from `APP_MODULES`, and Studio).
tags:
  - 'layer-module'
  - 'app-money'
  - 'app-startup'
  - 'app-studio'

dependsOn:
  - 'shared'
  - 'frame'
  - 'runtime'
  - 'feature-ledger'

tasks:
  # Only the main half emits; the renderer half is compiled by the app.
  build:
    command: 'pnpm exec tsc -b tsconfig.main.json'
    options:
      mergeArgs: 'replace'
    deps:
      - 'root:install'
      - 'shared:build'
      - 'runtime:build'
      - 'feature-ledger:build'
    inputs:
      - 'main/**/*'
      - 'manifest.ts'
      - 'tsconfig.main.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/features/ledger/main/**/*'
      - '/packages/features/ledger/manifest.ts'
    outputs:
      - 'dist'

  # Both configs: the renderer half against source, the main half against
  # shared/runtime's built declarations (project references), hence the builds.
  typecheck:
    # package.json's `typecheck` runs `tsc --noEmit` over both configs.
    command: 'pnpm run typecheck'
    options:
      mergeArgs: 'replace'
    deps:
      - 'shared:build'
      - 'runtime:build'
      - 'feature-ledger:build'
    inputs:
      - 'renderer/**/*'
      - 'main/**/*'
      - 'manifest.ts'
      - 'manifest.test.ts'
      - 'tsconfig.json'
      - 'tsconfig.main.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/features/ledger/renderer/**/*'
      - '/packages/features/ledger/manifest.ts'
      - '/packages/features/ledger/main/**/*'

  test:
    inputs:
      - 'renderer/**/*'
      - 'main/**/*'
      - 'manifest.ts'
      - 'manifest.test.ts'
      - 'vitest.config.ts'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/features/ledger/renderer/**/*'
      - '/packages/features/ledger/manifest.ts'
      - '/packages/features/ledger/main/**/*'

  lint:
    inputs:
      - 'renderer/**/*'
      - 'main/**/*'
      - '*.ts'
      - '/eslint.config.mjs'
