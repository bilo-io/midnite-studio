$schema: 'https://moonrepo.dev/schemas/project.json'

# Agents module package (Phase 124 Theme E): the agents host's compose code, views and main bridge, moved out
# of apps/agents. Same task shape as a feature package.
id: 'module-agents'
language: 'typescript'
layer: 'library'

# `app-<id>` names the apps that mount this module: its host and Studio. `scripts/affected-apps.mjs` reads them.
tags:
  - 'layer-module'
  - 'app-agents'
  - 'app-studio'

dependsOn:
  - 'shared'
  - 'frame'
  - 'runtime'
  - 'feature-report'
  - 'feature-chats'
  - 'feature-councils'
  - 'feature-models'
  - 'feature-workflows'
  - 'feature-mcp-tools'
  - 'feature-media-audio'
  - 'feature-media-game'
  - 'feature-media-map'
  - 'feature-media-model'
  - 'feature-media-sprite'
  - 'feature-media-terrain'

tasks:
  # Only the main half emits; the renderer half is compiled by the app.
  build:
    command: 'pnpm exec tsc -b tsconfig.main.json'
    options:
      mergeArgs: 'replace'
    deps:
      - 'root:install'
      - 'shared:build'
      - 'runtime:build'
      - 'feature-report:build'
      - 'feature-chats:build'
      - 'feature-councils:build'
      - 'feature-models:build'
      - 'feature-workflows:build'
      - 'feature-mcp-tools:build'
      - 'feature-media-audio:build'
      - 'feature-media-game:build'
      - 'feature-media-map:build'
      - 'feature-media-model:build'
      - 'feature-media-sprite:build'
      - 'feature-media-terrain:build'
    inputs:
      - 'main/**/*'
      - 'manifest.ts'
      - 'tsconfig.main.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/chats/manifest.ts'
      - '/packages/features/chats/main/**/*'
      - '/packages/features/councils/manifest.ts'
      - '/packages/features/councils/main/**/*'
      - '/packages/features/models/manifest.ts'
      - '/packages/features/models/main/**/*'
      - '/packages/features/workflows/manifest.ts'
      - '/packages/features/workflows/main/**/*'
      - '/packages/features/mcp-tools/manifest.ts'
      - '/packages/features/mcp-tools/main/**/*'
      - '/packages/features/media-audio/manifest.ts'
      - '/packages/features/media-audio/main/**/*'
      - '/packages/features/media-game/manifest.ts'
      - '/packages/features/media-game/main/**/*'
      - '/packages/features/media-map/manifest.ts'
      - '/packages/features/media-map/main/**/*'
      - '/packages/features/media-model/manifest.ts'
      - '/packages/features/media-model/main/**/*'
      - '/packages/features/media-sprite/manifest.ts'
      - '/packages/features/media-sprite/main/**/*'
      - '/packages/features/media-terrain/manifest.ts'
      - '/packages/features/media-terrain/main/**/*'
    outputs:
      - 'dist'

  typecheck:
    command: 'pnpm run typecheck'
    options:
      mergeArgs: 'replace'
    deps:
      - 'shared:build'
      - 'runtime:build'
      - 'feature-report:build'
      - 'feature-chats:build'
      - 'feature-councils:build'
      - 'feature-models:build'
      - 'feature-workflows:build'
      - 'feature-mcp-tools:build'
      - 'feature-media-audio:build'
      - 'feature-media-game:build'
      - 'feature-media-map:build'
      - 'feature-media-model:build'
      - 'feature-media-sprite:build'
      - 'feature-media-terrain:build'
    inputs:
      - 'renderer/**/*'
      - 'main/**/*'
      - 'manifest.ts'
      - 'manifest.test.ts'
      - 'tsconfig.json'
      - 'tsconfig.main.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/chats/renderer/**/*'
      - '/packages/features/chats/manifest.ts'
      - '/packages/features/chats/main/**/*'
      - '/packages/features/councils/renderer/**/*'
      - '/packages/features/councils/manifest.ts'
      - '/packages/features/councils/main/**/*'
      - '/packages/features/models/renderer/**/*'
      - '/packages/features/models/manifest.ts'
      - '/packages/features/models/main/**/*'
      - '/packages/features/workflows/renderer/**/*'
      - '/packages/features/workflows/manifest.ts'
      - '/packages/features/workflows/main/**/*'
      - '/packages/features/mcp-tools/renderer/**/*'
      - '/packages/features/mcp-tools/manifest.ts'
      - '/packages/features/mcp-tools/main/**/*'
      - '/packages/features/media-audio/renderer/**/*'
      - '/packages/features/media-audio/manifest.ts'
      - '/packages/features/media-audio/main/**/*'
      - '/packages/features/media-game/renderer/**/*'
      - '/packages/features/media-game/manifest.ts'
      - '/packages/features/media-game/main/**/*'
      - '/packages/features/media-map/renderer/**/*'
      - '/packages/features/media-map/manifest.ts'
      - '/packages/features/media-map/main/**/*'
      - '/packages/features/media-model/renderer/**/*'
      - '/packages/features/media-model/manifest.ts'
      - '/packages/features/media-model/main/**/*'
      - '/packages/features/media-sprite/renderer/**/*'
      - '/packages/features/media-sprite/manifest.ts'
      - '/packages/features/media-sprite/main/**/*'
      - '/packages/features/media-terrain/renderer/**/*'
      - '/packages/features/media-terrain/manifest.ts'
      - '/packages/features/media-terrain/main/**/*'

  test:
    inputs:
      - 'renderer/**/*'
      - 'main/**/*'
      - 'manifest.ts'
      - 'manifest.test.ts'
      - 'vitest.config.ts'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/chats/renderer/**/*'
      - '/packages/features/chats/manifest.ts'
      - '/packages/features/chats/main/**/*'
      - '/packages/features/councils/renderer/**/*'
      - '/packages/features/councils/manifest.ts'
      - '/packages/features/councils/main/**/*'
      - '/packages/features/models/renderer/**/*'
      - '/packages/features/models/manifest.ts'
      - '/packages/features/models/main/**/*'
      - '/packages/features/workflows/renderer/**/*'
      - '/packages/features/workflows/manifest.ts'
      - '/packages/features/workflows/main/**/*'
      - '/packages/features/mcp-tools/renderer/**/*'
      - '/packages/features/mcp-tools/manifest.ts'
      - '/packages/features/mcp-tools/main/**/*'
      - '/packages/features/media-audio/renderer/**/*'
      - '/packages/features/media-audio/manifest.ts'
      - '/packages/features/media-audio/main/**/*'
      - '/packages/features/media-game/renderer/**/*'
      - '/packages/features/media-game/manifest.ts'
      - '/packages/features/media-game/main/**/*'
      - '/packages/features/media-map/renderer/**/*'
      - '/packages/features/media-map/manifest.ts'
      - '/packages/features/media-map/main/**/*'
      - '/packages/features/media-model/renderer/**/*'
      - '/packages/features/media-model/manifest.ts'
      - '/packages/features/media-model/main/**/*'
      - '/packages/features/media-sprite/renderer/**/*'
      - '/packages/features/media-sprite/manifest.ts'
      - '/packages/features/media-sprite/main/**/*'
      - '/packages/features/media-terrain/renderer/**/*'
      - '/packages/features/media-terrain/manifest.ts'
      - '/packages/features/media-terrain/main/**/*'

  lint:
    inputs:
      - 'renderer/**/*'
      - 'main/**/*'
      - '*.ts'
      - '/eslint.config.mjs'
