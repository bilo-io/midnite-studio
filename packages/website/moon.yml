$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'

tasks:
  # Vite owns the build, not `tsc -b`. `mergeArgs: replace` is required: moon's
  # default is to APPEND a local task's args to the inherited ones, which would
  # run `pnpm exec tsc -b exec vite build`.
  #
  # `WEBSITE_BASE` is an input rather than plain environment: a deployed site
  # may be built with a path prefix (`/midnite-apps/midnite-studio/`) and a
  # local one is not, so without the variable in the hash a prefixed build
  # following a local build would be a cache HIT and ship with the wrong `base`
  # — every asset URL silently 404ing on a page that otherwise looks fine.
  #
  # `WEBSITE_ISSUE_TEMPLATE` is in the hash for exactly the same reason: it
  # decides whether the early-access section prefills a GitHub issue form or the
  # plain `?title=&body=` URL, and a cache hit across a change to it would ship
  # a section pointing at a template that is not there yet (or, once it is,
  # still not using it).
  build:
    command: 'pnpm exec vite build'
    options:
      mergeArgs: 'replace'
    deps:
      - 'root:install'
    inputs:
      - 'src/**/*'
      - 'index.html'
      - 'download/index.html'
      - 'public/**/*'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - 'package.json'
      - '$WEBSITE_BASE'
      - '$WEBSITE_ISSUE_TEMPLATE'
      # `WEBSITE_ORIGIN` is an input for the same reason as the two above: it is
      # inlined into the bundle (the download page's install command names the
      # site's own origin absolutely), so a build following one with a different
      # value must not be a cache hit.
      - '$WEBSITE_ORIGIN'
    outputs:
      - 'dist'

  # The dev server. Port 5174, so it can run beside the renderer's 5173.
  dev:
    command: 'pnpm exec vite'
    preset: 'server'

  # Serves `dist` over HTTP — the only way to check the built site behaves like
  # the deployed one (relative asset paths, the `/download/` directory index).
  preview:
    command: 'pnpm exec vite preview'
    preset: 'server'
    deps:
      - 'website:build'

  # sync-install: assert `public/install.sh` is still byte-identical to the
  # upstream installer in bilo-io/midnite-apps. `--check` diffs and fails;
  # `--write` re-syncs (`moon run website:sync-install -- --write`).
  #
  # Uncacheable and network-bound, which is exactly why it is a moon task and
  # not a vitest: the repo-wide `:test` gate must stay runnable offline. CI runs
  # it in the Website workflow's build job, post-merge on `main`.
  sync-install:
    command: 'node scripts/website-sync-install.mjs --check'
    options:
      cache: false
      runFromWorkspaceRoot: true

  # The inherited `test` task runs bare `vitest run`, which would not find
  # `vitest.config.ts` in its hash and so would stay a cache hit across a config
  # change. Everything else about it is inherited.
  #
  # `tailwind.config.ts` is in the hash for the same reason and it is not
  # cosmetic: `src/styles/colour-tokens.test.tsx` compiles that config to prove
  # every `/NN` opacity modifier resolves, so a regression there would land on a
  # cached PASS.
  test:
    inputs:
      - 'src/**/*'
      - 'vitest.config.ts'
      - 'tailwind.config.ts'
      - 'package.json'
