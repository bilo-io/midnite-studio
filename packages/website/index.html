<!doctype html>
<html lang="en">
  <head>
    <!-- No-flash: apply a stored/system theme before first paint. Mirrors src/theme.ts's applyTheme(). -->
    <script>(function(){try{var t=localStorage.getItem('midnite-studio.website.theme'),d=document.documentElement;t==='light'||t==='dark'?d.setAttribute('data-theme',t):matchMedia('(prefers-color-scheme: light)').matches&&d.classList.add('ws-auto-light')}catch(e){}})();</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <title>Midnite Studio — one window for the whole loop around a repository</title>
    <meta
      name="description"
      content="A desktop workspace for the whole loop around a repository: an interactive commit graph, worktree-aware staging, an integrated terminal and the forge, in one window. macOS, Apple silicon."
    />
    <meta name="theme-color" content="#0d0d14" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Midnite Studio" />
    <meta
      property="og:description"
      content="An interactive commit graph, worktree-aware staging, an integrated terminal and the forge — in one window."
    />
    <meta property="og:image" content="./img/app-showcase/multi-screen-horizontal-dark.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
