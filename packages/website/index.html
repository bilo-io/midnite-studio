<!doctype html>
<html lang="en">
  <head>
    <!-- No-flash: apply a stored/system theme before first paint. Mirrors src/theme.ts's applyTheme(). -->
    <script>(function(){try{var t=localStorage.getItem('midnite-studio.website.theme'),d=document.documentElement;t==='light'||t==='dark'?d.setAttribute('data-theme',t):matchMedia('(prefers-color-scheme: light)').matches&&d.classList.add('ws-auto-light')}catch(e){}})();</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <!--
      The brand face, preloaded. It is above the fold on both pages (the nav
      wordmark), and it is discovered only once the CSS has parsed and matched a
      `font-brand` element — a chain of three round trips for a 34 KB file, on
      the one word the page opens with. `crossorigin` is not optional even
      same-origin: a font request is CORS-mode, and a preload whose mode differs
      from the real request is a second download rather than a warm cache.

      The `href` is the source path, which Vite rewrites to the fingerprinted
      emitted asset (and prefixes with `base`) — the same file `site.css`'s
      `@font-face` resolves to, not a second copy.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/src/fonts/kaushan-script/KaushanScript-latin.woff2"
    />
    <title>Midnite Studio — one window for the whole loop around a repository</title>
    <meta
      name="description"
      content="A desktop workspace for the whole loop around a repository: an interactive commit graph, worktree-aware staging, an integrated terminal and the forge, in one window. macOS, Apple silicon."
    />
    <meta name="theme-color" content="#0d0d14" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Midnite Studio" />
    <meta
      property="og:description"
      content="An interactive commit graph, worktree-aware staging, an integrated terminal and the forge — in one window."
    />
    <meta property="og:image" content="./img/app-showcase/multi-screen-horizontal-dark.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
