$schema: 'https://moonrepo.dev/schemas/project.json'

# The terminal feature package (Phase 123 Theme E) — the terminal panel: the
# session list, every session's xterm, the panel store and its unload policy,
# behind a TerminalHost port. Renderer-only for now: the main half
# (terminal-service, pty-service) still lives in packages/desktop.
id: 'feature-terminal'
language: 'typescript'
layer: 'library'

# `FEATURE_PLACEMENT.terminal` = frame, so it reaches every app (`app-all`).
# `scripts/affected-apps.mjs` turns an affected project's tags into app ids.
tags:
  - 'layer-feature'
  - 'app-all'

dependsOn:
  - 'shared'
  - 'frame'

tasks:
  # No main half, so nothing emits. The inherited `build` (`tsc -b`, `outputs: dist`) can never produce
  # its output, and `app:build` → `desktop:dist` depends on it — so it is a no-op here, with no outputs.
  build:
    command: 'noop'
    options:
      mergeArgs: 'replace'
      mergeDeps: 'replace'
      mergeOutputs: 'replace'
    deps: []
    outputs: []

  typecheck:
    command: 'pnpm run typecheck'
    options:
      mergeArgs: 'replace'
    inputs:
      - 'renderer/**/*'
      - 'manifest.ts'
      - 'manifest.test.ts'
      - 'tsconfig.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'

  test:
    inputs:
      - 'renderer/**/*'
      - 'manifest.ts'
      - 'manifest.test.ts'
      - 'vitest.config.ts'
      - 'vitest-setup.ts'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'

  lint:
    inputs:
      - 'renderer/**/*'
      - '*.ts'
      - '/eslint.config.mjs'
