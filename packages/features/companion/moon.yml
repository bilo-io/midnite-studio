$schema: 'https://moonrepo.dev/schemas/project.json'

# The companion feature package (Phase 123 Theme F) — the companion panel, orb, thread and voice
# (renderer) and its snapshot, digest, ask, STT and TTS services (main). Same shape as
# feature-report (see docs/APPS.md, "Packages").
id: 'feature-companion'
language: 'typescript'
layer: 'library'

# `FEATURE_PLACEMENT.companion` = frame, so it reaches every app (`app-all`).
# `scripts/affected-apps.mjs` turns an affected project's tags into app ids.
tags:
  - 'layer-feature'
  - 'app-all'

dependsOn:
  - 'shared'
  - 'frame'
  - 'runtime'

tasks:
  # Only the main half emits; the renderer half is compiled by the app.
  build:
    command: 'pnpm exec tsc -b tsconfig.main.json'
    options:
      mergeArgs: 'replace'
    deps:
      - 'root:install'
      - 'shared:build'
      - 'runtime:build'
    inputs:
      - 'main/**/*'
      - 'manifest.ts'
      - 'tsconfig.main.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/runtime/src/**/*'
    outputs:
      - 'dist'

  # Both configs: the renderer half against source, the main half against
  # shared/runtime's built declarations (project references), hence the builds.
  typecheck:
    # package.json's `typecheck` runs `tsc --noEmit` over both configs.
    command: 'pnpm run typecheck'
    options:
      mergeArgs: 'replace'
    deps:
      - 'shared:build'
      - 'runtime:build'
    inputs:
      - 'renderer/**/*'
      - 'main/**/*'
      - 'manifest.ts'
      - 'manifest.test.ts'
      - 'tsconfig.json'
      - 'tsconfig.main.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/runtime/src/**/*'

  test:
    inputs:
      - 'renderer/**/*'
      - 'main/**/*'
      - 'manifest.ts'
      - 'manifest.test.ts'
      - 'vitest.config.ts'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/runtime/src/**/*'

  lint:
    inputs:
      - 'renderer/**/*'
      - 'main/**/*'
      - '*.ts'
      - '/eslint.config.mjs'
