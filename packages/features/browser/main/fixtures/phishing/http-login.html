<!doctype html>
<!-- Theme F acceptance fixture: a password form served over plain http:// — expected: caution. -->
<html>
  <head><title>Members area — sign in</title></head>
  <body>
    <form method="post" action="/login">
      <input name="user" autocomplete="username" />
      <input name="pass" type="password" autocomplete="current-password" />
      <button>Sign in</button>
    </form>
  </body>
</html>
