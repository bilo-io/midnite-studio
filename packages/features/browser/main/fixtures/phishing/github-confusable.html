<!doctype html>
<!-- Theme F acceptance fixture: a copy of GitHub's sign-in form, served from a host whose skeleton
     confuses with github.com (g1thub.com). Expected: danger. -->
<html>
  <head><title>Sign in to GitHub · GitHub</title></head>
  <body>
    <form action="/session" accept-charset="UTF-8" method="post">
      <input type="text" name="login" id="login_field" autocomplete="username" />
      <input type="password" name="password" id="password" autocomplete="current-password" />
      <input type="submit" name="commit" value="Sign in" />
    </form>
  </body>
</html>
