$schema: 'https://moonrepo.dev/schemas/project.json'

# The optimizer feature package (Phase 113 Theme C) — the first feature
# extracted from Studio, and the template every later one copies:
#   manifest.ts   pure data both halves read (views, settings pages, IPC, MCP tools)
#   renderer/     compiled from source by the composing app's Vite build
#   main/         built to dist/ (CommonJS) for desktop / the runtime
# See docs/APPS.md ("Packages").
id: 'feature-optimizer'
language: 'typescript'
layer: 'library'

# `app-<id>` names the apps that compose this feature, from the placement map
# (`FEATURE_PLACEMENT.optimizer` = cleaner); Studio composes every feature.
# `scripts/affected-apps.mjs` turns an affected project's tags into app ids.
tags:
  - 'layer-feature'
  - 'app-cleaner'
  - 'app-studio'

dependsOn:
  - 'shared'
  - 'frame'
  - 'runtime'

tasks:
  # Only the main half emits; the renderer half is compiled by the app.
  build:
    command: 'pnpm exec tsc -b tsconfig.main.json'
    options:
      mergeArgs: 'replace'
    deps:
      - 'root:install'
      - 'shared:build'
      - 'runtime:build'
    inputs:
      - 'main/**/*'
      - 'manifest.ts'
      - 'tsconfig.main.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/runtime/src/**/*'
    outputs:
      - 'dist'

  # Both configs: the renderer half against source, the main half against
  # shared/runtime's built declarations (project references), hence the builds.
  typecheck:
    # package.json's `typecheck` runs `tsc --noEmit` over both configs.
    command: 'pnpm run typecheck'
    options:
      mergeArgs: 'replace'
    deps:
      - 'shared:build'
      - 'runtime:build'
    inputs:
      - 'renderer/**/*'
      - 'main/**/*'
      - 'manifest.ts'
      - 'manifest.test.ts'
      - 'tsconfig.json'
      - 'tsconfig.main.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/runtime/src/**/*'

  test:
    inputs:
      - 'renderer/**/*'
      - 'main/**/*'
      - 'manifest.ts'
      - 'manifest.test.ts'
      - 'vitest.config.ts'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/runtime/src/**/*'

  lint:
    inputs:
      - 'renderer/**/*'
      - 'main/**/*'
      - '*.ts'
      - '/eslint.config.mjs'
