$schema: 'https://moonrepo.dev/schemas/project.json'

# The Database feature package (Phase 113 Theme O) — saved connections, the pooled
# query service and the credential vault binding (main); the connection tree, query
# tabs, editor and results grid (renderer). Same shape as feature-tests (see
# docs/APPS.md, "Packages"); main also reaches db-engine, as forge reaches git-engine.
id: 'feature-database'
language: 'typescript'
layer: 'library'

# `app-<id>` names the apps that compose this feature, from the placement map
# (`FEATURE_PLACEMENT.database` = coder); Studio composes every feature.
# `scripts/affected-apps.mjs` turns an affected project's tags into app ids.
tags:
  - 'layer-feature'
  - 'app-coder'
  - 'app-studio'

dependsOn:
  - 'shared'
  - 'frame'
  - 'runtime'
  - 'db-engine'

tasks:
  # Only the main half emits; the renderer half is compiled by the app.
  build:
    command: 'pnpm exec tsc -b tsconfig.main.json'
    options:
      mergeArgs: 'replace'
    deps:
      - 'root:install'
      - 'shared:build'
      - 'runtime:build'
      - 'db-engine:build'
    inputs:
      - 'main/**/*'
      - 'manifest.ts'
      - 'tsconfig.main.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/db-engine/src/**/*'
    outputs:
      - 'dist'

  # Both configs: the renderer half against source, the main half against
  # shared/runtime/db-engine's built declarations (project references), hence the builds.
  typecheck:
    # package.json's `typecheck` runs `tsc --noEmit` over both configs.
    command: 'pnpm run typecheck'
    options:
      mergeArgs: 'replace'
    deps:
      - 'shared:build'
      - 'runtime:build'
      - 'db-engine:build'
    inputs:
      - 'renderer/**/*'
      - 'main/**/*'
      - 'manifest.ts'
      - 'manifest.test.ts'
      - 'tsconfig.json'
      - 'tsconfig.main.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/db-engine/src/**/*'

  test:
    inputs:
      - 'renderer/**/*'
      - 'main/**/*'
      - 'manifest.ts'
      - 'manifest.test.ts'
      - 'vitest.config.ts'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/db-engine/src/**/*'

  lint:
    inputs:
      - 'renderer/**/*'
      - 'main/**/*'
      - '*.ts'
      - '/eslint.config.mjs'
