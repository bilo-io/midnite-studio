$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'

# Phase 113 Theme C: Studio's main-side composer (`scripts/affected-apps.mjs`
# reads `app-*`). git-engine and db-engine carry no app tag of their own — they
# reach Studio through this project, as moon's downstream dependents.
tags:
  - 'layer-app'
  - 'app-studio'

# All four are `development` scope so moon's package.json sync keeps them in
# devDependencies. None is a RUNTIME dependency of the packaged app:
#
#   shared, git-engine, db-engine  inlined into the esbuild bundles (scripts/bundle.mjs)
#   app                            ships as a prebuilt static bundle loaded from disk
#
# The distinction is load-bearing, not cosmetic. electron-builder resolves
# `dependencies` by walking node_modules, follows pnpm's workspace symlinks into
# sibling directories, and fails with "<sibling path> must be under
# packages/desktop/". Only dugite and node-pty are real runtime deps.
dependsOn:
  - id: 'shared'
    scope: 'development'
  - id: 'git-engine'
    scope: 'development'
  - id: 'db-engine'
    scope: 'development'
  - id: 'knowledge'
    scope: 'development'
  # Phase 113 Theme C: the runtime layer and the optimizer feature's main half,
  # both inlined into the bundle like the engines above.
  - id: 'runtime'
    scope: 'development'
  - id: 'feature-optimizer'
    scope: 'development'
  - id: 'feature-monitor'
    scope: 'development'
  - id: 'feature-notes'
    scope: 'development'
  - id: 'feature-finance'
    scope: 'development'
  - id: 'feature-tests'
    scope: 'development'
  - id: 'feature-forge'
    scope: 'development'
  - id: 'feature-api-client'
    scope: 'development'
  - id: 'feature-database'
    scope: 'development'
  - id: 'feature-media-core'
    scope: 'development'
  - id: 'feature-media-images'
    scope: 'development'
  - id: 'feature-media-video'
    scope: 'development'
  - id: 'feature-media-map'
    scope: 'development'
  - id: 'feature-media-terrain'
    scope: 'development'
  - id: 'feature-media-sprite'
    scope: 'development'
  - id: 'feature-media-game'
    scope: 'development'
  - id: 'feature-media-audio'
    scope: 'development'
  - id: 'feature-media-docs'
    scope: 'development'
  - id: 'feature-models'
    scope: 'development'
  - id: 'feature-councils'
  - id: 'feature-workflows'
  - id: 'feature-mcp-tools'
    scope: 'development'
  - id: 'feature-chats'
    scope: 'development'
  - id: 'app'
    scope: 'development'

tasks:
  # tsc --noEmit resolves shared/git-engine through project references but does
  # not build them, so build those two first. Deliberately NOT `^:build`: that
  # would also build the renderer bundle, which desktop never imports as a module.
  #
  # The upstream SOURCES are listed as inputs, not just as deps. moon hashes a
  # task from its own declared inputs, so without them a change confined to
  # git-engine leaves this task a cache hit and `desktop:typecheck` reports green
  # against an engine API that no longer exists — which then surfaces as a
  # baffling failure one command later.
  typecheck:
    deps:
      - 'shared:build'
      - 'git-engine:build'
      - 'db-engine:build'
      - 'knowledge:build'
      - 'runtime:build'
      - 'feature-optimizer:build'
      - 'feature-monitor:build'
      - 'feature-notes:build'
      - 'feature-finance:build'
      - 'feature-tests:build'
      - 'feature-forge:build'
      - 'feature-api-client:build'
      - 'feature-database:build'
      - 'feature-media-core:build'
      - 'feature-media-docs:build'
      - 'feature-media-images:build'
      - 'feature-models:build'
      - 'feature-councils:build'
      - 'feature-workflows:build'
      - 'feature-mcp-tools:build'
      - 'feature-chats:build'
      - 'feature-media-video:build'
      - 'feature-media-map:build'
      - 'feature-media-terrain:build'
      - 'feature-media-sprite:build'
      - 'feature-media-game:build'
      - 'feature-media-audio:build'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/git-engine/src/**/*'
      - '/packages/db-engine/src/**/*'
      - '/packages/knowledge/src/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/features/optimizer/main/**/*'
      - '/packages/features/optimizer/manifest.ts'
      - '/packages/features/monitor/main/**/*'
      - '/packages/features/monitor/manifest.ts'
      - '/packages/features/notes/main/**/*'
      - '/packages/features/notes/manifest.ts'
      - '/packages/features/finance/main/**/*'
      - '/packages/features/finance/manifest.ts'
      - '/packages/features/tests/main/**/*'
      - '/packages/features/tests/manifest.ts'
      - '/packages/features/forge/main/**/*'
      - '/packages/features/forge/manifest.ts'
      - '/packages/features/api-client/main/**/*'
      - '/packages/features/api-client/manifest.ts'
      - '/packages/features/database/main/**/*'
      - '/packages/features/database/manifest.ts'
      - '/packages/features/media-core/main/**/*'
      - '/packages/features/media-core/manifest.ts'
      - '/packages/features/media-docs/main/**/*'
      - '/packages/features/media-docs/manifest.ts'
      - '/packages/features/media-images/main/**/*'
      - '/packages/features/media-video/main/**/*'
      - '/packages/features/media-map/main/**/*'
      - '/packages/features/media-terrain/main/**/*'
      - '/packages/features/media-sprite/main/**/*'
      - '/packages/features/media-game/main/**/*'
      - '/packages/features/media-audio/main/**/*'
      - '/packages/features/media-images/manifest.ts'
      - '/packages/features/models/main/**/*'
      - '/packages/features/models/manifest.ts'
      - '/packages/features/councils/main/**/*'
      - '/packages/features/workflows/main/**/*'
      - '/packages/features/mcp-tools/main/**/*'
      - '/packages/features/councils/manifest.ts'
      - '/packages/features/workflows/manifest.ts'
      - '/packages/features/mcp-tools/manifest.ts'
      - '/packages/features/chats/main/**/*'
      - '/packages/features/chats/manifest.ts'
      - '/packages/features/media-video/manifest.ts'
      - '/packages/features/media-map/manifest.ts'
      - '/packages/features/media-terrain/manifest.ts'
      - '/packages/features/media-sprite/manifest.ts'
      - '/packages/features/media-game/manifest.ts'
      - '/packages/features/media-audio/manifest.ts'

  # Same reasoning as `typecheck`, for the same reason it bites harder here:
  # vitest RESOLVES `@midnite/studio-shared` at run time, through the package's
  # `exports` into `shared/dist`. With no dep, a clean checkout has no `dist`
  # and every one of these files dies at import with "Failed to resolve entry
  # for package" — which is what CI had been doing while local runs stayed
  # green off a `dist` some earlier command happened to leave behind.
  test:
    deps:
      - 'shared:build'
      - 'git-engine:build'
      - 'db-engine:build'
      - 'knowledge:build'
      - 'runtime:build'
      - 'feature-optimizer:build'
      - 'feature-monitor:build'
      - 'feature-notes:build'
      - 'feature-finance:build'
      - 'feature-tests:build'
      - 'feature-forge:build'
      - 'feature-api-client:build'
      - 'feature-database:build'
      - 'feature-media-core:build'
      - 'feature-media-docs:build'
      - 'feature-media-images:build'
      - 'feature-models:build'
      - 'feature-councils:build'
      - 'feature-workflows:build'
      - 'feature-mcp-tools:build'
      - 'feature-chats:build'
      - 'feature-media-video:build'
      - 'feature-media-map:build'
      - 'feature-media-terrain:build'
      - 'feature-media-sprite:build'
      - 'feature-media-game:build'
      - 'feature-media-audio:build'
      - '~:bundle'
    inputs:
      - 'src/**/*'
      - 'scripts/bundle.mjs'
      # Phase 53 Theme C: yaml-scalar.mjs's own test, picked up by
      # vitest.config.ts's `scripts/**/*.test.mjs` include.
      - 'scripts/**/*.test.mjs'
      - 'scripts/lib/**/*'
      - 'vitest.config.ts'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/git-engine/src/**/*'
      - '/packages/db-engine/src/**/*'
      - '/packages/knowledge/src/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/features/optimizer/main/**/*'
      - '/packages/features/optimizer/manifest.ts'
      - '/packages/features/monitor/main/**/*'
      - '/packages/features/monitor/manifest.ts'
      - '/packages/features/notes/main/**/*'
      - '/packages/features/notes/manifest.ts'
      - '/packages/features/finance/main/**/*'
      - '/packages/features/finance/manifest.ts'
      - '/packages/features/tests/main/**/*'
      - '/packages/features/tests/manifest.ts'
      - '/packages/features/forge/main/**/*'
      - '/packages/features/forge/manifest.ts'
      - '/packages/features/api-client/main/**/*'
      - '/packages/features/api-client/manifest.ts'
      - '/packages/features/database/main/**/*'
      - '/packages/features/database/manifest.ts'
      - '/packages/features/media-core/main/**/*'
      - '/packages/features/media-core/manifest.ts'
      - '/packages/features/media-docs/main/**/*'
      - '/packages/features/media-docs/manifest.ts'
      - '/packages/features/media-images/main/**/*'
      - '/packages/features/media-video/main/**/*'
      - '/packages/features/media-map/main/**/*'
      - '/packages/features/media-terrain/main/**/*'
      - '/packages/features/media-sprite/main/**/*'
      - '/packages/features/media-game/main/**/*'
      - '/packages/features/media-audio/main/**/*'
      - '/packages/features/media-images/manifest.ts'
      - '/packages/features/models/main/**/*'
      - '/packages/features/models/manifest.ts'
      - '/packages/features/councils/main/**/*'
      - '/packages/features/workflows/main/**/*'
      - '/packages/features/mcp-tools/main/**/*'
      - '/packages/features/councils/manifest.ts'
      - '/packages/features/workflows/manifest.ts'
      - '/packages/features/mcp-tools/manifest.ts'
      - '/packages/features/chats/main/**/*'
      - '/packages/features/chats/manifest.ts'
      - '/packages/features/media-video/manifest.ts'
      - '/packages/features/media-map/manifest.ts'
      - '/packages/features/media-terrain/manifest.ts'
      - '/packages/features/media-sprite/manifest.ts'
      - '/packages/features/media-game/manifest.ts'
      - '/packages/features/media-audio/manifest.ts'

  lint:
    inputs:
      - 'src/**/*'
      - 'scripts/**/*'
      - '/eslint.config.mjs'

  # Bundle main + preload + broker + mcp-shim into single files (see
  # scripts/bundle.mjs). esbuild resolves every non-external import from
  # node_modules, so `root:install` is an explicit dep: without it moon schedules
  # the install alongside the bundle, and on a checkout whose node_modules
  # predates a new dependency the bundle loses the race with "Could not resolve"
  # while the install is killed mid-run — which is exactly how a fresh pull that
  # added `@modelcontextprotocol/sdk` broke `desktop:install-local`.
  bundle:
    command: 'node scripts/bundle.mjs'
    deps:
      - 'root:install'
    inputs:
      - 'src/**/*'
      - 'scripts/bundle.mjs'
      # The sourcemap switch is an INPUT, or the escape hatch does not work
      # (Phase 36 Theme C): maps are opt-in now, and without this
      # `MSTUDIO_SOURCEMAP=1 moon run desktop:bundle` after any prior build is a
      # cache hit that silently restores the map-less `dist/`. A debugging session
      # would then be spent wondering where the maps went.
      - '$MSTUDIO_SOURCEMAP'
      - '/packages/shared/src/**/*'
      - '/packages/git-engine/src/**/*'
      - '/packages/db-engine/src/**/*'
      - '/packages/knowledge/src/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/features/optimizer/main/**/*'
      - '/packages/features/optimizer/manifest.ts'
      - '/packages/features/monitor/main/**/*'
      - '/packages/features/monitor/manifest.ts'
      - '/packages/features/notes/main/**/*'
      - '/packages/features/notes/manifest.ts'
      - '/packages/features/finance/main/**/*'
      - '/packages/features/finance/manifest.ts'
      - '/packages/features/tests/main/**/*'
      - '/packages/features/tests/manifest.ts'
      - '/packages/features/forge/main/**/*'
      - '/packages/features/forge/manifest.ts'
      - '/packages/features/api-client/main/**/*'
      - '/packages/features/api-client/manifest.ts'
      - '/packages/features/database/main/**/*'
      - '/packages/features/database/manifest.ts'
      - '/packages/features/media-core/main/**/*'
      - '/packages/features/media-core/manifest.ts'
      - '/packages/features/media-docs/main/**/*'
      - '/packages/features/media-docs/manifest.ts'
      - '/packages/features/media-images/main/**/*'
      - '/packages/features/media-video/main/**/*'
      - '/packages/features/media-map/main/**/*'
      - '/packages/features/media-terrain/main/**/*'
      - '/packages/features/media-sprite/main/**/*'
      - '/packages/features/media-game/main/**/*'
      - '/packages/features/media-audio/main/**/*'
      - '/packages/features/media-images/manifest.ts'
      - '/packages/features/models/main/**/*'
      - '/packages/features/models/manifest.ts'
      - '/packages/features/councils/main/**/*'
      - '/packages/features/workflows/main/**/*'
      - '/packages/features/mcp-tools/main/**/*'
      - '/packages/features/councils/manifest.ts'
      - '/packages/features/workflows/manifest.ts'
      - '/packages/features/mcp-tools/manifest.ts'
      - '/packages/features/chats/main/**/*'
      - '/packages/features/chats/manifest.ts'
      - '/packages/features/media-video/manifest.ts'
      - '/packages/features/media-map/manifest.ts'
      - '/packages/features/media-terrain/manifest.ts'
      - '/packages/features/media-sprite/manifest.ts'
      - '/packages/features/media-game/manifest.ts'
      - '/packages/features/media-audio/manifest.ts'
    outputs:
      - 'dist/bundle'

  # Produce the macOS arm64 dmg + zip.
  #
  # `--publish never`: this repo NEVER wants electron-builder itself to
  # publish, in dev, in ci.yml's `package` job, or in the tag-triggered
  # release workflow — publishing is deliberately a separate
  # `action-gh-release` step against `bilo-io/midnite-apps` (Phase 53 Theme
  # D), never electron-builder's own upload path, and the `generic` provider
  # in `electron-builder.yml`'s `publish:` block is read-only by construction
  # anyway (it only tells electron-updater where to fetch a manifest). Baked
  # into the task itself rather than passed per-invocation: `verify-dist`
  # depends on `~:dist`, and `options.cache: false` below means that
  # dependency re-invokes this exact command on every run — a flag passed only
  # via `moon run desktop:dist -- --publish never` would silently vanish the
  # moment something downstream re-triggers this task unflagged.
  dist:
    command: 'pnpm exec electron-builder --mac --config electron-builder.yml --publish never'
    deps:
      - '~:bundle'
      - 'app:build'
    inputs:
      - 'dist/bundle/**/*'
      - 'electron-builder.yml'
      - 'scripts/afterpack.cjs'
      - 'package.json'
    # macOS-only packaging; never in `moon ci` on Linux. `outputs` is
    # deliberately unset: the dmg + zip are ~200MB and moon's content-addressed
    # cache fails to store artifacts that size (`cas::read_failed`) — and
    # caching a release build buys nothing anyway.
    options:
      runInCI: false
      cache: false

  # Copy the built .app into /Applications with `ditto`.
  install-local:
    command: 'node scripts/install-local.mjs'
    deps:
      - '~:dist'
    options:
      runInCI: false
      cache: false

  # Rebuild node-pty against Electron's ABI. Only needed after an Electron bump
  # or a fresh install whose prebuild targets a different ABI — never in CI,
  # which runs no Electron binary.
  rebuild-native:
    command: 'node scripts/rebuild-native.mjs'
    options:
      runInCI: false
      cache: false

  # Dev: compile main+preload, then run Electron against the Vite dev server.
  # `app:dev` is a persistent dep, so moon starts the two together and Electron
  # retries the connection until Vite is listening.
  start:
    command: 'node scripts/start-electron.mjs'
    preset: 'server'
    deps:
      - '~:bundle'
      - 'app:dev'

  # Same, but against the built renderer over file:// — the only way to
  # reproduce a bug that depends on the production asset paths without
  # packaging first.
  start-built:
    command: 'node scripts/start-electron.mjs'
    preset: 'server'
    env:
      MSTUDIO_USE_BUILT_RENDERER: '1'
    deps:
      - '~:bundle'
      - 'app:build'

  verify-dist:
    command: 'node scripts/verify-dist.mjs'
    deps:
      - '~:dist'
    options:
      runInCI: false
      cache: false

