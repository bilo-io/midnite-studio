$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'

# All four are `development` scope so moon's package.json sync keeps them in
# devDependencies. None is a RUNTIME dependency of the packaged app:
#
#   shared, git-engine, db-engine  inlined into the esbuild bundles (scripts/bundle.mjs)
#   app                            ships as a prebuilt static bundle loaded from disk
#
# The distinction is load-bearing, not cosmetic. electron-builder resolves
# `dependencies` by walking node_modules, follows pnpm's workspace symlinks into
# sibling directories, and fails with "<sibling path> must be under
# packages/desktop/". Only dugite and node-pty are real runtime deps.
dependsOn:
  - id: 'shared'
    scope: 'development'
  - id: 'git-engine'
    scope: 'development'
  - id: 'db-engine'
    scope: 'development'
  - id: 'app'
    scope: 'development'

tasks:
  # tsc --noEmit resolves shared/git-engine through project references but does
  # not build them, so build those two first. Deliberately NOT `^:build`: that
  # would also build the renderer bundle, which desktop never imports as a module.
  #
  # The upstream SOURCES are listed as inputs, not just as deps. moon hashes a
  # task from its own declared inputs, so without them a change confined to
  # git-engine leaves this task a cache hit and `desktop:typecheck` reports green
  # against an engine API that no longer exists — which then surfaces as a
  # baffling failure one command later.
  typecheck:
    deps:
      - 'shared:build'
      - 'git-engine:build'
      - 'db-engine:build'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/git-engine/src/**/*'
      - '/packages/db-engine/src/**/*'

  # Same reasoning as `typecheck`, for the same reason it bites harder here:
  # vitest RESOLVES `@midnite/studio-shared` at run time, through the package's
  # `exports` into `shared/dist`. With no dep, a clean checkout has no `dist`
  # and every one of these files dies at import with "Failed to resolve entry
  # for package" — which is what CI had been doing while local runs stayed
  # green off a `dist` some earlier command happened to leave behind.
  test:
    deps:
      - 'shared:build'
      - 'git-engine:build'
      - 'db-engine:build'
    inputs:
      - 'src/**/*'
      - 'vitest.config.ts'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/git-engine/src/**/*'
      - '/packages/db-engine/src/**/*'

  lint:
    inputs:
      - 'src/**/*'
      - 'scripts/**/*'
      - '/eslint.config.mjs'

  # Bundle main + preload into single files (see scripts/bundle.mjs).
  bundle:
    command: 'node scripts/bundle.mjs'
    inputs:
      - 'src/**/*'
      - 'scripts/bundle.mjs'
      # The sourcemap switch is an INPUT, or the escape hatch does not work
      # (Phase 36 Theme C): maps are opt-in now, and without this
      # `MSTUDIO_SOURCEMAP=1 moon run desktop:bundle` after any prior build is a
      # cache hit that silently restores the map-less `dist/`. A debugging session
      # would then be spent wondering where the maps went.
      - '$MSTUDIO_SOURCEMAP'
      - '/packages/shared/src/**/*'
      - '/packages/git-engine/src/**/*'
      - '/packages/db-engine/src/**/*'
    outputs:
      - 'dist/bundle'

  # Produce the macOS arm64 dmg + zip.
  dist:
    command: 'pnpm exec electron-builder --mac --config electron-builder.yml'
    deps:
      - '~:bundle'
      - 'app:build'
    inputs:
      - 'dist/bundle/**/*'
      - 'electron-builder.yml'
      - 'scripts/afterpack.cjs'
      - 'package.json'
    # macOS-only packaging; never in `moon ci` on Linux. `outputs` is
    # deliberately unset: the dmg + zip are ~200MB and moon's content-addressed
    # cache fails to store artifacts that size (`cas::read_failed`) — and
    # caching a release build buys nothing anyway.
    options:
      runInCI: false
      cache: false

  # Copy the built .app into /Applications with `ditto`.
  install-local:
    command: 'node scripts/install-local.mjs'
    deps:
      - '~:dist'
    options:
      runInCI: false
      cache: false

  # Rebuild node-pty against Electron's ABI. Only needed after an Electron bump
  # or a fresh install whose prebuild targets a different ABI — never in CI,
  # which runs no Electron binary.
  rebuild-native:
    command: 'node scripts/rebuild-native.mjs'
    options:
      runInCI: false
      cache: false

  # Dev: compile main+preload, then run Electron against the Vite dev server.
  # `app:dev` is a persistent dep, so moon starts the two together and Electron
  # retries the connection until Vite is listening.
  start:
    command: 'node scripts/start-electron.mjs'
    preset: 'server'
    deps:
      - '~:bundle'
      - 'app:dev'

  # Same, but against the built renderer over file:// — the only way to
  # reproduce a bug that depends on the production asset paths without
  # packaging first.
  start-built:
    command: 'node scripts/start-electron.mjs'
    preset: 'server'
    env:
      MSTUDIO_USE_BUILT_RENDERER: '1'
    deps:
      - '~:bundle'
      - 'app:build'

  verify-dist:
    command: 'node scripts/verify-dist.mjs'
    deps:
      - '~:dist'
    options:
      runInCI: false
      cache: false

