appId: io.bilo.midnite-studio
# The user-visible app name — the .app bundle, the macOS menu bar, the Dock.
# Distribution identifiers stay lowercase `midnite-studio` (appId, the artifact
# names below, TERM_PROGRAM), matching the midnite app's split.
productName: Midnite Studio

directories:
  output: release
  buildResources: resources

# Version- and arch-stamped asset names. The `midnite-studio-` prefix is spelled out
# rather than interpolated from ${productName}: a display name with a space in it
# would put one in every dmg/zip filename and in the CI artifact path.
artifactName: midnite-studio-${version}-${arch}.${ext}

# The asar carries only the two esbuild bundles. Everything from the workspace
# is already inlined into them (see scripts/bundle.mjs), so the workspace
# symlinks must be kept out — electron-builder follows them into sibling
# directories and fails on paths outside the app root.
files:
  - dist/bundle/**/*
  - package.json
  - '!node_modules/@midnite/**'
  - '!dist/main/**'
  - '!dist/preload/**'

extraResources:
  # The renderer, loaded over file:// from Resources/renderer/index.html
  # (see src/main/window.ts). Static assets, so no reason to put them in the asar.
  - from: ../app/dist
    to: renderer
  # The onboarding kit (Phase 49 Theme A) — a root-level tree, not under any
  # package, so it needs its own entry here or a packaged build has no
  # `templates/` at all. Read off `process.resourcesPath` in production; the
  # repo root in dev. See `main/template-path.ts` for the one helper that
  # owns the branch.
  - from: ../../templates
    to: templates

asar: true
asarUnpack:
  # Native modules cannot be loaded from inside an asar.
  - '**/*.node'
  # The broker script runs under ELECTRON_RUN_AS_NODE outside the asar.
  - 'dist/bundle/broker.js'
  - '**/node_modules/node-pty/**'
  # dugite's bundled git — 42MB of real executables that must exist on disk.
  # dugite resolves them relative to its own __dirname and already rewrites an
  # `app.asar` segment to `app.asar.unpacked`, so unpacking here is all it needs.
  - '**/node_modules/dugite/git/**'

# The only native module is node-pty, and it is rebuilt deliberately by
# `moon run desktop:rebuild-native`. electron-builder's own rebuild pass walks
# pnpm's virtual store and trips over its optional/dangling entries.
npmRebuild: false

# Re-assert +x on node-pty's spawn-helper and on dugite's git binaries, prune
# dangling symlinks, and ad-hoc sign so an unsigned local build still launches.
afterPack: scripts/afterpack.cjs

mac:
  category: public.app-category.developer-tools
  # The midnite crescent, shared with the midnite app (resources/icon.icns).
  icon: resources/icon.icns
  # Apple Silicon only: an Intel build would need node-pty rebuilt on an x64
  # runner to be correct, and this is a macOS-arm64-first app.
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  # Required for notarization and harmless while unsigned.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  # Signing is env-gated: with a Developer ID cert (CSC_LINK + CSC_KEY_PASSWORD)
  # electron-builder signs the bundle; without one, the release workflow sets
  # CSC_IDENTITY_AUTO_DISCOVERY=false and afterpack.cjs ad-hoc signs it so it
  # still launches locally.
  notarize: false

afterSign: scripts/notarize.cjs

protocols:
  - name: Midnite Studio
    schemes:
      - midnite-studio
    role: Viewer

# Public downloads live in bilo-io/midnite-apps, not here: this repo is private, and an
# updater feed has to be fetchable without a token. That repo distributes several apps, so its
# release tags are namespaced (`midnite-studio/v0.3.1`) and `releases/latest` there means "the
# newest release of *any* app in it".
#
# Which is why this is the `generic` provider rather than `github`. electron-updater's GitHub
# provider resolves the feed by asking for the repo's latest release and reading the
# `latest-mac.yml` attached to it — in a shared repo that is whichever app shipped most
# recently, so it would happily hand Midnite Studio another app's update manifest. The generic
# provider asks for `<url>/latest-mac.yml` instead, and the per-app path makes that
# unambiguous. Uploading is `gh release upload` from the release flow, not
# `electron-builder --publish`, which the generic provider cannot do.
publish:
  - provider: generic
    url: https://raw.githubusercontent.com/bilo-io/midnite-apps/main/midnite-studio/feed
    channel: latest

dmg:
  window:
    width: 660
    height: 400
  title: '${productName} ${version}'
  contents:
    - x: 180
      y: 210
      type: file
    - x: 480
      y: 210
      type: link
      path: /Applications

