$schema: 'https://moonrepo.dev/schemas/toolchain.json'

node:
  # Keep in lockstep with `.prototools` (what proto actually installs). A mismatch
  # here makes moon rewrite each package.json's `engines.node` on every run.
  version: '22.12.0'
  packageManager: 'pnpm'
  pnpm:
    version: '9.15.0'

  # moon's default is to run `pnpm dedupe` whenever it sees the lockfile change.
  # In CI every fresh checkout looks like a change, so this fires on every job —
  # a full resolution pass that rewrites pnpm-lock.yaml underneath a workflow
  # that deliberately installed with `--frozen-lockfile`. Deduping is a
  # considered, local act; it has no business running inside the gate.
  dedupeOnLockfileChange: false

# TypeScript project-reference syncing is intentionally OFF. When enabled, moon
# re-serialises every package tsconfig on each run — stripping the hand-written
# explanatory comments and reformatting them — and generates a root `tsconfig.json`
# that `extends` a `tsconfig.options.json` we don't have. The committed tsconfigs
# are the source of truth.
typescript:
  syncProjectReferences: false
