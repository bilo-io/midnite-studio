name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Phase 82 Theme E — `gate` split by platform.
  #
  # Before this split, one `gate` job ran `moon run :typecheck :lint :test` —
  # every project's typecheck/lint/test, unconditionally — on macos-14, because
  # git-engine's integration tests shell out to dugite's bundled git and desktop
  # needs a real Electron/node-pty environment. That macOS requirement is real
  # for those two packages, but `moon run :typecheck :lint :test` does not know
  # that: it ran shared/app/website/db-engine's suites on the 10x-billed macOS
  # runner too, for no reason other than sharing a job with git-engine/desktop.
  #
  # Measured locally before splitting (CI run 34394558428, plus a fresh
  # per-package `moon run <pkg>:typecheck <pkg>:lint <pkg>:test --force` with
  # MOON_CACHE=off on an otherwise-busy dev machine, so treat these as orders of
  # magnitude rather than tight numbers — this PR's own CI run is the real
  # measurement):
  #
  #   | Package    | typecheck+lint+test |
  #   |------------|----------------------|
  #   | shared     | ~15s                 |
  #   | db-engine  | ~20s                 |
  #   | desktop    | ~37s                 |
  #   | website    | ~45s                 |
  #   | git-engine | ~75s (incl. shared:build dependency) |
  #   | app        | ~4m                  |
  #
  # `app` alone accounts for roughly two-thirds of the old `gate` job's 264s
  # test step — it is by far the largest suite (3,733 vitest tests) and the
  # ~400 unit tests Phase 82's later themes migrate out of Playwright land here
  # too. Splitting means that growth compounds on a 1x runner, not a 10x one.
  # `git-engine` and `desktop` together are a fraction of that, and they are
  # exactly the two packages with a genuine macOS dependency (dugite's bundled
  # git; node-pty + Electron's native module ABI) — everything else
  # (shared/app/website/db-engine, all zod/React/Vite/node, no `electron`
  # import anywhere in them per the package-boundary rules in CLAUDE.md) is
  # platform-agnostic and has no business paying macOS's 10x billing rate on a
  # private repo.
  gate-node:
    # ubuntu-24.04, 1x billing: shared, app, website, db-engine. None of these
    # import `electron` or shell out to a real git binary in their test suites
    # (git-engine is the one exception, and it is on gate-native below).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # moon compares against the merge base to decide what is affected.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      # @bilo-io/ui and @bilo-io/shell come from GitHub Packages, which requires
      # an Authorization header even for public packages. GITHUB_TOKEN carries
      # `packages: read` for this repo's own org, so no PAT is needed in CI.
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tracker check
        run: pnpm exec moon run root:tracker-check

      # Lockstep invariant (Phase 53 Theme B): every packages/*/package.json
      # shares one MAJOR.MINOR. Runs before the build so a hand-edited version
      # fails fast rather than surfacing later as a release-time surprise.
      - name: Version check
        run: pnpm exec moon run root:version-check

      # Guards this very split (Phase 82 Theme E): `moon run :typecheck :lint
      # :test` used to walk every project automatically, so a new
      # packages/<x> directory was covered for free. Two explicit target
      # lists below do not grow themselves — a new package lands in neither
      # job unless someone adds it — so this reads packages/* off disk and
      # fails loudly if scripts/gate-projects-check.mjs's NODE_PROJECTS/
      # NATIVE_PROJECTS stop covering it exactly once.
      - name: Package split guard
        run: pnpm exec moon run root:gate-projects-check

      # Explicit project-scoped targets, not `:typecheck :lint :test` — that
      # form runs EVERY project, which is exactly what this split undoes.
      # `root:test` runs the repo-wide scripts/*.test.mjs suite (tracker-check,
      # version-check, gate-projects-check, the changelog mirror): plain node
      # scripts, no platform dependency, so it belongs here rather than on
      # gate-native.
      #
      # `app:test` is NOT here — see `gate-node-app-test` below (Phase 82 Theme
      # H). `app:typecheck`/`app:lint` stay unsharded: they are fast (part of
      # the 71s this step measured at, together with shared/website/db-engine's
      # full typecheck+lint+test and root:test), and only the vitest run itself
      # is the expensive part worth sharding.
      - name: Typecheck, lint, test (node-portable packages, app:test excluded)
        run: >-
          pnpm exec moon run
          shared:typecheck shared:lint shared:test
          app:typecheck app:lint
          website:typecheck website:lint website:test
          db-engine:typecheck db-engine:lint db-engine:test
          root:test
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Phase 82 Theme H — `app:test` sharded out of `gate-node` into its own
  # matrix job, the same fix Phase 56 applied to Playwright
  # (`vitest --shard=<index>/<count>`, confirmed working on the pinned vitest
  # 3.2.7).
  #
  # Theme E's own run (PR #321) found that splitting the gate by platform did
  # NOT halve `gate-node`'s wall clock — ubuntu's slower cores cancelled out
  # the smaller workload, leaving a 261s test step against the undivided
  # gate's 264s. This job is why: measured directly on THIS PR's own
  # ubuntu-24.04 runner (run 34453964938, `MEASURE: app:test in isolation`
  # step, a throwaway split committed for exactly this reading and since
  # removed) — `app:test` alone took **173s**, against **71s** for every
  # other node-portable package's typecheck+lint+test *combined* plus
  # `root:test`. `app:test` was ~68% of `gate-node`'s content, confirming
  # Theme E's own prediction rather than inferring it from local numbers.
  #
  # Shard count, from that same run's numbers rather than copying e2e's 8:
  # this job's fixed per-shard overhead (checkout + pnpm/node setup + install,
  # no Playwright browser download) measured **~85s** in `gate-node`'s own run
  # (341s job total − 256s of test-content steps). Modelling wall clock as
  # `85 + 173/N`:
  #
  #   | N | 85 + 173/N |
  #   |---|------------|
  #   | 1 | 258s (today) |
  #   | 2 | 172s |
  #   | 3 | 143s |
  #   | 4 | **128s** |
  #   | 6 | 114s |
  #   | 8 | 107s |
  #
  # Marginal returns fall off hard past 4: 3→4 saves ~15s, 4→6 saves ~14s over
  # two more jobs (~7s each), 6→8 saves ~7s over two more still. N=4 takes the
  # steepest part of the curve without adding jobs for single-digit-second
  # returns — this suite is vitest/jsdom, not Playwright, so its per-test cost
  # is cheap enough that the fixed setup tax dominates much sooner. Local
  # sharding (`vitest --shard=1/4`, 3,818 tests) split close to evenly (997
  # tests / 21s of 3,818 tests / 73s, ≈26% of both), so the model's even split
  # is a reasonable approximation for a jsdom suite with no one dominant file
  # the way Playwright's `fab-loops.spec.ts` is (see the `e2e` job's own
  # comment).
  #
  # Confirmed by this PR's own follow-up run (34455067085): three of the four
  # shards started immediately and measured 121s/135s/125s — within a few
  # seconds of the 128s the model above predicts for N=4. The fourth queued
  # ~108s late (see the `e2e` job's concurrency note) but still finished in
  # 119s of its own runtime once it started, consistent with the other three.
  gate-node-app-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'app:test (shard ${{ matrix.shard }}/4)'
        run: pnpm exec moon run app:test -- --shard=${{ matrix.shard }}/4
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gate-native:
    # macos-14, 10x billing — reserved for the two packages that genuinely need
    # it: git-engine's integration tests shell out to dugite's bundled git, and
    # desktop links node-pty against Electron's native module ABI. Both are
    # meaningfully faster and cheaper to keep here than to fight for portability
    # they do not have.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # moon compares against the merge base to decide what is affected.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck, lint, test (git-engine, desktop)
        run: >-
          pnpm exec moon run
          git-engine:typecheck git-engine:lint git-engine:test
          desktop:typecheck desktop:lint desktop:test
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The integration tests create commits; git refuses without an identity.
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com

  # Phase 61 Theme J / Decision 5 — the real-database driver tests
  # (packages/db-engine/src/drivers/drivers.test.ts) skip themselves
  # (`it.skipIf(!env)`) whenever `testConnectionFor` finds no
  # `MSTUDIO_TEST_<PROVIDER>_*` env vars, which is every local run and — until
  # this job — every CI run too, since `gate` runs on macos-14 and GitHub's
  # `services:` containers are Docker-based, Linux-runner-only. So `gate`
  # itself can never host these regardless of env vars; they need a job of
  # their own on a Linux runner.
  #
  # Postgres/MySQL/MariaDB run here as service containers — small images,
  # seconds to start. MSSQL does NOT: Decision 5 is explicit that its ~1.5 GB
  # image, EULA env var and slow health-gate keep it a manual pass rather than
  # a fourth container, so `MSTUDIO_TEST_MSSQL_*` is deliberately never set
  # here — `mssql driver (CI service container)` in drivers.test.ts skips in
  # this job exactly as it does on a bare laptop, and stays that way until a
  # human runs it against a real instance.
  #
  # `db-engine:test` only, not `:typecheck :lint :test` — this job exists for
  # the service containers, and `gate` already covers every other package's
  # suite (including db-engine's OWN non-driver tests) on every PR.
  db-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mstudio
          POSTGRES_PASSWORD: mstudio
          POSTGRES_DB: mstudio_test
        ports:
          - 5432:5432
        # `pg_isready` with no `-U` connects as the OS user running the
        # healthcheck inside the container — root — which this database never
        # granted a role, so every probe failed `role "root" does not exist`
        # until the retries ran out and GitHub killed the container (seen
        # first-hand: this exact job's first run). Explicit `-U`/`-d` probes
        # the role/database that actually exist.
        options: >-
          --health-cmd "pg_isready -U mstudio -d mstudio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: mstudio
          MYSQL_DATABASE: mstudio_test
          MYSQL_USER: mstudio
          MYSQL_PASSWORD: mstudio
        ports:
          - 3306:3306
        # Explicit root credentials for the same reason as postgres above —
        # an unauthenticated `mysqladmin ping` happened to pass against this
        # image, but the sibling mariadb container's own unauthenticated ping
        # did not (its actual failure, same run), so both get the same
        # explicit, unambiguous form rather than relying on an image-specific
        # default that already proved inconsistent one container over.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmstudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Mapped to host port 3307 — mysql's own container already claims 3306,
      # and GitHub's service containers are exposed on the runner's network
      # directly, not to each other, so both need distinct host ports.
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: mstudio
          MARIADB_DATABASE: mstudio_test
          MARIADB_USER: mstudio
          MARIADB_PASSWORD: mstudio
        ports:
          - 3307:3306
        # Not `mysqladmin ping` — confirmed live, twice, on this exact job:
        # the server logged "ready for connections" within seconds both
        # times, with no auth-error trace at all (unlike postgres's very
        # visible "role does not exist" the first time this file got it
        # wrong), yet every health probe still reported unhealthy for the
        # full retry budget — consistent with `mysqladmin` simply not
        # existing in this image rather than a rejected connection. The
        # official mariadb image ships its own purpose-built script for
        # exactly this instead.
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: db-engine test (against real service containers)
        run: pnpm exec moon run db-engine:test
        env:
          MSTUDIO_TEST_POSTGRES_HOST: localhost
          MSTUDIO_TEST_POSTGRES_PORT: '5432'
          MSTUDIO_TEST_POSTGRES_DATABASE: mstudio_test
          MSTUDIO_TEST_POSTGRES_USER: mstudio
          MSTUDIO_TEST_POSTGRES_PASSWORD: mstudio
          MSTUDIO_TEST_MYSQL_HOST: 127.0.0.1
          MSTUDIO_TEST_MYSQL_PORT: '3306'
          MSTUDIO_TEST_MYSQL_DATABASE: mstudio_test
          MSTUDIO_TEST_MYSQL_USER: mstudio
          MSTUDIO_TEST_MYSQL_PASSWORD: mstudio
          MSTUDIO_TEST_MARIADB_HOST: 127.0.0.1
          MSTUDIO_TEST_MARIADB_PORT: '3307'
          MSTUDIO_TEST_MARIADB_DATABASE: mstudio_test
          MSTUDIO_TEST_MARIADB_USER: mstudio
          MSTUDIO_TEST_MARIADB_PASSWORD: mstudio

  # The Playwright suite is deliberately OUT of `moon run :test` — it needs a
  # chromium download, which is a poor thing to make the gate depend on — but
  # nothing ran it either, and on 2026-08-27 seventeen specs sat red on `main`
  # across several merges before anyone noticed. So it gets a job of its own,
  # blocking like the gate: a non-blocking e2e job reproduces exactly the failure
  # mode it is here to prevent.
  #
  # ubuntu, not macOS: the suite drives the renderer in headless chromium against
  # the Vite dev server with a mocked `window.midniteStudio` (see
  # test-support/mock-bridge.ts). No Electron, no dugite, no packaged app — nothing in it
  # is macOS-specific, and macOS minutes bill at 10x on a private repo.
  #
  # Sharded eight ways (Phase 56 Theme A — up from four). Unsharded, this job
  # took 21m30s against 3m0s for the same specs locally. A private repo's
  # ubuntu runner is 2-core, so Playwright takes `cores/2` = ONE worker where a
  # 12-core laptop takes six, on slower cores. `gate` finishes in ~2m20s, so a
  # single e2e job would have set the floor for every PR at twenty minutes.
  # Four shards put it back to ~7 (measured: 6m39s–7m30s); eight shards halve
  # each shard's slice of the suite again, for about the same total runner
  # minutes — affordable precisely because this lane is ubuntu at 1x rather
  # than macOS at 10x.
  #
  # Workers stay at the default (cores/2 = ONE) ON PURPOSE. Raising them on a
  # 2-core runner oversubscribes it — Phase 56 Theme C measured `workers: 2`
  # against this suite's actual profile (mostly waiting on the local Vite
  # server and the DOM, not CPU-bound) rather than assuming the theory held,
  # and three full CI runs (24 shard-attempts) came back green with no
  # measured speedup (~4m28s/shard average vs. this baseline's ~4m22s). See
  # `playwright.config.ts`'s own comment for the numbers. Add shards, not
  # workers.
  #
  # `timeout-minutes` is not decoration. Without it a job inherits GitHub's
  # 6-HOUR default, and the first attempt at this one looked hung at 22 minutes
  # while three sibling shards finished in six. It was not hung — it was
  # grinding: nine `palette.spec.ts` specs pressed a hard-coded `Meta+k` that
  # does nothing on Linux (`Mod` is Ctrl there), and each failure cost three
  # attempts at the 60s CI test timeout. 9 x 3 x 60s is half an hour of pure
  # failure on one worker. The chords are fixed now; with eight shards each
  # running roughly an eighth of the suite in well under 3 minutes, 10 minutes
  # is generous headroom for retries while still failing fast on a real hang.
  #
  # Phase 82 Theme G — re-measured at the suite's current (post Theme A/C) size
  # before touching this number, and the numbers say **do not change it yet.**
  # Declared tests dropped 976 → 655 (Theme A), but run 34453964938 (this PR,
  # 8 shards) shows the worst-case shard's content essentially UNCHANGED —
  # 330s against the old baseline's 332s — because Theme A's cut was almost
  # entirely self-skipping `*-shots` specs that cost ~0s, not real work: total
  # real content across all 8 shards only dropped 2,308s → 2,158s (6.5%).
  # Per-shard content: 330 / 298 / 278 / 276 / 265 / 247 / 243 / 221 (=2,158s),
  # average 270s; per-shard fixed overhead (checkout + setup + install)
  # measured at ~70–90s.
  #
  # The worst shard is worst for a specific, identifiable reason:
  # `fab-loops.spec.ts` alone contributes 45 of that shard's 82 tests (55%) —
  # by far the largest single file in the suite (next is `terminal.spec.ts` at
  # 39; playwright's `--shard` assigns whole files, never splits one across
  # shards).
  #
  # **Tried 12 shards (run 34455067085) and measured a non-adoption.** Content
  # did drop: 190 / 183 / 184 / 236 / 145 / 236 / 185 / 170 / 137 / 202 / 165 /
  # 198 (=2,231s, work conserved), worst-case 330s → 236s. But the trade is
  # poor at this suite size: that 12-shard run's worst e2e job (316s) against
  # the baseline's 397s is 81s of wall clock bought for four extra jobs — the
  # workflow's aggregate runner time rose from ~55 to ~68.8 minutes, roughly
  # 13:1 seconds-of-runner-time per second-of-wall-clock saved. 12 e2e shards
  # alongside Theme H's 4 `gate-node-app-test` shards also put ~19 ubuntu jobs
  # in flight at once — 4 of the 12 e2e shards and 1 of the 4 app-test shards
  # were visibly queued 60-100s late in that run, eating into the win.
  #
  # More decisively: this theme is specified to run *after* Theme C's
  # migration waves land, not at 655 declared tests — its own checklist reads
  # "with ~245 e2e tests remaining after Theme C, re-measure ... rather than
  # inheriting the existing 8-shard split." Waves 2-5 will remove ~300 more
  # tests, shrinking every shard for free; re-measuring now, mid-migration,
  # tells us nothing about the right count once the suite reaches its
  # post-Theme-C size. So: **8 shards, unchanged**, on the Phase 56 Theme C
  # `workers: 2` precedent that a measured non-adoption is a valid result of
  # this kind of theme. Re-run this measurement once Theme C's waves land.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      # Every shard reports. Cancelling siblings on the first failure would hide
      # three quarters of a broken suite behind whichever shard happened to fail.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keyed on the resolved @playwright/test version, so a version bump busts
      # the cache instead of restoring browsers the new runner cannot use.
      - name: Resolve Playwright version
        id: pw
        # From packages/app: @playwright/test is declared there, and pnpm's
        # non-flat node_modules means it is NOT resolvable from the root.
        working-directory: packages/app
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # `--with-deps` only on a cache miss: it is an apt install, and re-running
      # it against a warm browser cache is pure wall-clock.
      - name: Install chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/app

      # Phase 56 Theme E: the `webServer` block below starts a cold Vite dev
      # server, which spends 20-30s of every shard's runtime on-demand
      # compiling chunks nobody has asked for yet. Keying on the lockfile,
      # Vite's own config and a hash of the source tree means the cache is
      # invalidated exactly when Vite would have produced different output —
      # a stale `.vite` dir from a different source tree is worse than none.
      - uses: actions/cache@v4
        with:
          path: packages/app/node_modules/.vite
          key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/app/vite.config.ts', 'packages/app/src/**') }}
          restore-keys: |
            vite-${{ runner.os }}-

      # `app:e2e` — the whole suite. Until Phase 38 Theme H this ran `app:e2e-ci`
      # against a second config (`playwright.ci.config.ts`) that blocked on
      # everything except a named `KNOWN_RED` list of files still being repaired;
      # Theme H emptied that list and retired the ratchet, so CI now blocks on
      # the same suite a human runs locally.
      - name: E2E (shard ${{ matrix.shard }}/8)
        run: pnpm exec moon run app:e2e -- --shard=${{ matrix.shard }}/8
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `trace: 'retain-on-failure'` — so this only has something to upload when
      # a spec actually failed, and that is precisely when it is worth having.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: packages/app/test-results
          if-no-files-found: ignore

  # The pixel-diff layer — Phase 82 Theme D. Component-scoped `toHaveScreenshot`
  # crops (`packages/app/e2e/visual/`), blocking like `e2e` above, not an
  # advisory job: a baseline is only worth having if a regression against it
  # actually fails the PR.
  #
  # Runs INSIDE the official Playwright image as a job `container`, not merely
  # on the same `ubuntu-24.04` base it is built from. That distinction is the
  # whole point: `playwright.visual.config.ts`'s `snapshotPathTemplate` keys
  # baselines on `process.platform` ('linux' either way), but a pixel diff
  # cares about font/fontconfig/freetype versions too, which a bare runner's
  # own apt packages are not guaranteed to match build-for-build. The
  # container pins those exactly, and it is the SAME image the dev
  # regeneration command (`playwright.visual.config.ts`'s own header comment)
  # runs — so a baseline a developer generates locally through that command
  # and what this job asserts against are, byte for byte, the same rendering
  # environment.
  #
  # `--ignore-scripts` on the install: this image is deliberately minimal (no
  # `make`/build-essential), so `better-sqlite3`/`node-pty`'s native builds
  # fail here the way they would not on `gate-native`'s macOS runner or the
  # bare `e2e` job's ubuntu-24.04. Harmless for this job specifically — it
  # only ever runs `shared:build` (plain `tsc`, no native code) and
  # `app:visual` (Vite + Playwright, same as `e2e`), neither of which touches
  # desktop's or git-engine's native dependencies at all.
  visual:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # A `container:` job checks the repo out as the RUNNER's user, but the
      # steps below execute as the container image's own user — a different
      # UID, which git's ownership check (CVE-2022-24765's fix) refuses to
      # trust by default: "detected dubious ownership in repository at
      # '/__w/…'". `app:visual` depends on `shared:build`, and moon shells out
      # to git to decide what is affected/cacheable, so without this the very
      # first `moon run` call in this job fails before touching Playwright at
      # all — reproduced on this PR's own first CI run. Every OTHER job in
      # this file runs directly on the runner (no `container:`), which is
      # exactly why none of them needed this — this job is the first to need
      # container-level font parity (see the job's own header comment).
      - name: Mark the checkout as a safe git directory (container job, different UID than the checkout owner)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # No pnpm/action-setup or actions/setup-node here: the container image
      # ships its own Node (newer than the repo's pinned 22.12.0, harmless for
      # this job's narrow needs), and corepack is how pnpm is actually reached
      # inside it — the same recipe the dev regeneration command's docker
      # invocation uses, verified to produce an identical install.
      - name: Enable corepack, activate the pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install (--ignore-scripts — see the job comment above)
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fails fast, and separately from the pixel comparison below, if the
      # committed baseline corpus has grown past its cap — a budget breach
      # and a real visual regression are different failures with different
      # fixes, so they get different steps rather than one conflated result.
      - name: Visual baseline budget (~100 baselines / 3 MB)
        run: node scripts/visual-budget.mjs

      # `app:visual` depends on `shared:build` (see packages/app/moon.yml), so
      # moon builds shared first automatically — no separate step needed, the
      # same shape `app:e2e` uses above.
      - name: Visual regression (toHaveScreenshot against committed Linux baselines)
        run: pnpm exec moon run app:visual
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Same pattern as the `e2e` job's own upload: only something to attach
      # when a spec actually failed, and that is exactly when the diff PNGs
      # `toHaveScreenshot` writes next to the actual/expected pair are worth
      # having — a reviewer can look at `*-diff.png` without re-running
      # anything.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff-report
          path: packages/app/test-results
          if-no-files-found: ignore

  package:
    # Packaging is macOS-arm64 only and slow, so it runs on main rather than on
    # every PR. It is here to catch electron-builder breakage early — the pnpm
    # symlink and native-module traps only show up in a real package.
    if: github.ref == 'refs/heads/main'
    needs: [gate-node, gate-node-app-test, gate-native]
    runs-on: macos-14
    # A job-level `permissions:` block REPLACES the workflow default rather than
    # adding to it, so `packages: read` alone leaves `contents` at none — and
    # actions/checkout then fails to clone this PRIVATE repo with the maximally
    # unhelpful "remote: Repository not found". Both scopes are required.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild native modules for Electron
        run: pnpm exec moon run desktop:rebuild-native

      - name: Package
        run: pnpm exec moon run desktop:dist
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Developer ID cert in CI: build cleanly unsigned. afterpack.cjs
          # ad-hoc signs the bundle so it still launches locally.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify Distribution Integrity
        run: pnpm exec moon run desktop:verify-dist
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: midnite-studio-macos-arm64
          path: packages/desktop/release/*.dmg
          if-no-files-found: error
