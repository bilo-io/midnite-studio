<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      #title {
        color: #fff;
        font-size: 140px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <!-- The example composition: a title that eases in and fades out (3s, like the Remotion example).
         Copy this folder to start a video. -->
    <div
      id="root"
      data-composition-id="ExampleHello"
      data-start="0"
      data-duration="3"
      data-width="1920"
      data-height="1080"
    >
      <h1 id="title" class="clip" data-start="0" data-duration="3" data-track-index="0">Hello, video</h1>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        "#title",
        { opacity: 0, y: 40, scale: 0.9 },
        { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" },
        0,
      );
      tl.to("#title", { opacity: 0, duration: 0.6, ease: "power1.in" }, 2.4);
      window.__timelines["ExampleHello"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
