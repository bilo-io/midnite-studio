$schema: 'https://moonrepo.dev/schemas/project.json'

# Midnite Creator (Phase 113 Theme Q) — media-core + the Docs and Images tab features +
# `packages/frame` + `shared`, composed in src/.
# `resources/icon.icns` is what makes a release pack it (scripts/make-icon.mjs writes it).
id: 'app-creator'
language: 'typescript'

tags:
  - 'layer-app'
  - 'app-creator'

dependsOn:
  - 'shared'
  - 'frame'
  - 'runtime'
  - 'feature-media-core'
  - 'feature-media-docs'
  - 'feature-media-images'

tasks:
  build:
    command: 'pnpm run build'
    options:
      mergeArgs: 'replace'
    deps:
      - 'root:install'
    inputs:
      - 'src/**/*'
      - 'main/**/*'
      - 'scripts/bundle-main.mjs'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/media-core/renderer/**/*'
      - '/packages/features/media-core/manifest.ts'
      - '/packages/features/media-core/main/**/*'
      - '/packages/features/media-docs/renderer/**/*'
      - '/packages/features/media-docs/manifest.ts'
      - '/packages/features/media-docs/main/**/*'
      - '/packages/features/media-images/renderer/**/*'
      - '/packages/features/media-images/manifest.ts'
      - '/packages/features/media-images/main/**/*'
      - '/packages/runtime/src/**/*'
    outputs:
      - 'dist'

  typecheck:
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tailwind.config.ts'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/media-core/renderer/**/*'
      - '/packages/features/media-core/manifest.ts'
      - '/packages/features/media-docs/renderer/**/*'
      - '/packages/features/media-docs/manifest.ts'
      - '/packages/features/media-images/renderer/**/*'
      - '/packages/features/media-images/manifest.ts'

  test:
    inputs:
      - 'src/**/*'
      - 'vitest.config.ts'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/media-core/renderer/**/*'
      - '/packages/features/media-core/manifest.ts'
      - '/packages/features/media-docs/renderer/**/*'
      - '/packages/features/media-docs/manifest.ts'
      - '/packages/features/media-images/renderer/**/*'
      - '/packages/features/media-images/manifest.ts'
