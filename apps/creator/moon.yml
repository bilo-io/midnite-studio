$schema: 'https://moonrepo.dev/schemas/project.json'

# Midnite Creator (Phase 113 Theme Q) — media-core + the Docs and Images tab features +
# `packages/frame` + `shared`, composed in src/.
# `resources/icon.icns` is what makes a release pack it (`moon run launcher:icons` writes it from the launcher's tile logo).
id: 'app-creator'
language: 'typescript'

tags:
  - 'layer-app'
  - 'app-creator'

dependsOn:
  - 'shared'
  - 'frame'
  - 'runtime'
  - 'feature-media-core'
  - 'feature-media-docs'
  - 'feature-media-images'
  - 'feature-slides'
  - 'feature-media-video'
  - 'feature-media-audio'
  - 'feature-report'
  - 'module-creator'

tasks:
  build:
    command: 'pnpm run build'
    options:
      mergeArgs: 'replace'
    deps:
      - 'root:install'
    inputs:
      - 'src/**/*'
      - 'main/**/*'
      - 'scripts/bundle-main.mjs'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/media-core/renderer/**/*'
      - '/packages/features/media-core/manifest.ts'
      - '/packages/features/media-core/main/**/*'
      - '/packages/features/media-docs/renderer/**/*'
      - '/packages/features/media-docs/manifest.ts'
      - '/packages/features/media-docs/main/**/*'
      - '/packages/features/media-images/renderer/**/*'
      - '/packages/features/slides/renderer/**/*'
      - '/packages/modules/creator/renderer/**/*'
      - '/packages/modules/creator/main/**/*'
      - '/packages/modules/creator/manifest.ts'
      - '/packages/features/media-video/renderer/**/*'
      - '/packages/features/media-audio/renderer/**/*'
      - '/packages/features/media-images/manifest.ts'
      - '/packages/features/slides/manifest.ts'
      - '/packages/features/media-video/manifest.ts'
      - '/packages/features/media-audio/manifest.ts'
      - '/packages/features/media-images/main/**/*'
      - '/packages/features/media-video/main/**/*'
      - '/packages/features/media-audio/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/report/bridge.ts'
      - '/templates/media-video/**/*'
    outputs:
      - 'dist'

  typecheck:
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tailwind.config.ts'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/media-core/renderer/**/*'
      - '/packages/features/media-core/manifest.ts'
      - '/packages/features/media-docs/renderer/**/*'
      - '/packages/features/media-docs/manifest.ts'
      - '/packages/features/media-images/renderer/**/*'
      - '/packages/features/slides/renderer/**/*'
      - '/packages/modules/creator/renderer/**/*'
      - '/packages/modules/creator/main/**/*'
      - '/packages/modules/creator/manifest.ts'
      - '/packages/features/media-video/renderer/**/*'
      - '/packages/features/media-audio/renderer/**/*'
      - '/packages/features/media-images/manifest.ts'
      - 'main/**/*'
      - '/packages/features/media-core/main/**/*'
      - '/packages/features/media-docs/main/**/*'
      - '/packages/features/media-images/main/**/*'
      - '/packages/features/slides/manifest.ts'
      - '/packages/features/media-video/manifest.ts'
      - '/packages/features/media-audio/manifest.ts'
      - '/packages/features/media-video/main/**/*'
      - '/packages/features/media-audio/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/report/bridge.ts'

  test:
    inputs:
      - 'src/**/*'
      - 'vitest.config.ts'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/media-core/renderer/**/*'
      - '/packages/features/media-core/manifest.ts'
      - '/packages/features/media-docs/renderer/**/*'
      - '/packages/features/media-docs/manifest.ts'
      - '/packages/features/media-images/renderer/**/*'
      - '/packages/features/slides/renderer/**/*'
      - '/packages/modules/creator/renderer/**/*'
      - '/packages/modules/creator/main/**/*'
      - '/packages/modules/creator/manifest.ts'
      - '/packages/features/media-video/renderer/**/*'
      - '/packages/features/media-audio/renderer/**/*'
      - '/packages/features/media-images/manifest.ts'
      - 'main/**/*'
      - '/packages/features/media-core/main/**/*'
      - '/packages/features/media-docs/main/**/*'
      - '/packages/features/media-images/main/**/*'
      - '/packages/features/slides/manifest.ts'
      - '/packages/features/media-video/manifest.ts'
      - '/packages/features/media-audio/manifest.ts'
      - '/packages/features/media-video/main/**/*'
      - '/packages/features/media-audio/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/report/bridge.ts'
