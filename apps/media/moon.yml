$schema: 'https://moonrepo.dev/schemas/project.json'

# Midnite Media (Phase 113 Theme R) — media-core + the Library tab feature + `packages/frame` + `shared`,
# composed in src/. `resources/icon.icns` is what makes a release pack it (`moon run launcher:icons` writes it from the launcher's tile logo).
id: 'app-media'
language: 'typescript'

tags:
  - 'layer-app'
  - 'app-media'

dependsOn:
  - 'shared'
  - 'frame'
  - 'runtime'
  - 'feature-report'
  - 'feature-media-core'
  - 'feature-media-library'
  - 'module-media'
  - 'module-creator'
  - 'feature-media-docs'
  - 'feature-media-images'
  - 'feature-media-video'
  - 'feature-media-audio'

tasks:
  build:
    command: 'pnpm run build'
    options:
      mergeArgs: 'replace'
    deps:
      - 'root:install'
    inputs:
      - 'src/**/*'
      - 'main/**/*'
      - 'scripts/bundle-main.mjs'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/bridge.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/media-core/renderer/**/*'
      - '/packages/features/media-core/manifest.ts'
      - '/packages/features/media-library/renderer/**/*'
      - '/packages/features/media-library/manifest.ts'
      - '/packages/features/media-library/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/modules/media/main/**/*'
      - '/packages/modules/media/renderer/**/*'
      - '/packages/modules/media/manifest.ts'
      - '/packages/modules/creator/main/**/*'
      - '/packages/modules/creator/manifest.ts'
      - '/packages/features/media-core/main/**/*'
      - '/packages/features/media-docs/main/**/*'
      - '/packages/features/media-images/main/**/*'
      - '/packages/features/media-video/main/**/*'
      - '/packages/features/media-audio/main/**/*'
    outputs:
      - 'dist'

  typecheck:
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tailwind.config.ts'
      - 'main/**/*'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/bridge.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/media-core/renderer/**/*'
      - '/packages/features/media-core/manifest.ts'
      - '/packages/features/media-library/renderer/**/*'
      - '/packages/features/media-library/manifest.ts'
      - '/packages/features/media-library/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/modules/media/main/**/*'
      - '/packages/modules/media/renderer/**/*'
      - '/packages/modules/media/manifest.ts'
      - '/packages/modules/creator/main/**/*'
      - '/packages/modules/creator/manifest.ts'
      - '/packages/features/media-core/main/**/*'
      - '/packages/features/media-docs/main/**/*'
      - '/packages/features/media-images/main/**/*'
      - '/packages/features/media-video/main/**/*'
      - '/packages/features/media-audio/main/**/*'

  test:
    inputs:
      - 'src/**/*'
      - 'main/**/*'
      - 'vitest.config.ts'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/bridge.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/media-core/renderer/**/*'
      - '/packages/features/media-core/manifest.ts'
      - '/packages/features/media-library/renderer/**/*'
      - '/packages/features/media-library/manifest.ts'
      - '/packages/features/media-library/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/modules/media/main/**/*'
      - '/packages/modules/media/renderer/**/*'
      - '/packages/modules/media/manifest.ts'
      - '/packages/modules/creator/main/**/*'
      - '/packages/modules/creator/manifest.ts'
      - '/packages/features/media-core/main/**/*'
      - '/packages/features/media-docs/main/**/*'
      - '/packages/features/media-images/main/**/*'
      - '/packages/features/media-video/main/**/*'
      - '/packages/features/media-audio/main/**/*'
