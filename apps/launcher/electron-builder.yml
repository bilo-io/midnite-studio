# Midnite Apps — the launcher's own macOS arm64 build.
#
# Deliberately small: no native modules, no extraResources, no node_modules at
# runtime (main + preload are esbuild bundles with everything but `electron`
# inlined, and the renderer is a static Vite build). What is left is the
# Electron framework itself, which is why this is ~100 MB and not ArtCraft's
# 17 MB — see the PR that added it for that trade-off.
#
# Publishing is never electron-builder's job here either; a release goes to
# bilo-io/midnite-apps under a namespaced `midnite-launcher/vX.Y.Z` tag, the
# same scheme `packages/desktop` follows.
appId: io.bilo.midnite-launcher
productName: Midnite Apps
directories:
  output: release
  buildResources: resources
artifactName: midnite-launcher-${version}-${arch}.${ext}
files:
  - dist/**/*
  - package.json
  - '!node_modules/**'
asar: true
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  notarize: false
afterSign: scripts/notarize.cjs

# The `midnite://open?app=…` router (Phase 113 Theme D): the launcher is the registered handler.
protocols:
  - name: Midnite Apps
    schemes:
      - midnite
    role: Viewer

# The launcher's own updates (Phase 113 Theme E, `src/main/updater.ts`): electron-updater reads
# the app-update.yml this generates. `generic`, never `github` — bilo-io/midnite-apps hosts every
# midnite app, so its latest release is not necessarily this one — and namespaced under
# `midnite-launcher/feed`, beside Studio's `midnite-studio/feed`. Nothing here publishes:
# `dist` runs with `--publish never`; the release skills write the feed (Theme F).
publish:
  - provider: generic
    url: https://raw.githubusercontent.com/bilo-io/midnite-apps/main/midnite-launcher/feed
    channel: latest
