$schema: 'https://moonrepo.dev/schemas/project.json'

# Midnite Vanguard (Phase 120 Theme B) — an app that ships as its own bundle:
# `packages/features/vanguard` + `packages/frame` + `shared`, composed in src/.
# `resources/icon.icns` is what makes a release pack it (`moon run launcher:icons` writes it from the launcher's tile logo).
id: 'app-vanguard'
language: 'typescript'

tags:
  - 'layer-app'
  - 'app-vanguard'

dependsOn:
  - 'shared'
  - 'frame'
  - 'runtime'
  - 'feature-report'
  - 'feature-sessions'
  - 'feature-vanguard'
  - 'module-vanguard'
  - 'module-vault'
  - 'module-cleaner'
  - 'module-monitor'
  - 'feature-vault'
  - 'feature-optimizer'
  - 'feature-monitor'
  - 'git-engine'

tasks:
  build:
    command: 'pnpm run build'
    options:
      mergeArgs: 'replace'
    deps:
      - 'root:install'
    inputs:
      - 'src/**/*'
      - 'main/**/*'
      - 'scripts/bundle-main.mjs'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/bridge.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/vanguard/renderer/**/*'
      - '/packages/features/vanguard/manifest.ts'
      - '/packages/features/vanguard/main/**/*'
      - '/packages/features/sessions/main/**/*'
      - '/packages/features/sessions/manifest.ts'
      - '/packages/runtime/src/**/*'
      - '/packages/modules/vanguard/main/**/*'
      - '/packages/modules/vanguard/renderer/**/*'
      - '/packages/modules/vanguard/manifest.ts'
      - '/packages/modules/vault/main/**/*'
      - '/packages/modules/vault/manifest.ts'
      - '/packages/modules/cleaner/main/**/*'
      - '/packages/modules/cleaner/manifest.ts'
      - '/packages/modules/monitor/main/**/*'
      - '/packages/modules/monitor/manifest.ts'
      - '/packages/features/vault/main/**/*'
      - '/packages/features/vault/manifest.ts'
      - '/packages/features/optimizer/main/**/*'
      - '/packages/features/optimizer/manifest.ts'
      - '/packages/features/monitor/main/**/*'
      - '/packages/features/monitor/manifest.ts'
      - '/packages/git-engine/src/**/*'
    outputs:
      - 'dist'

  typecheck:
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tailwind.config.ts'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/bridge.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/vanguard/renderer/**/*'
      - '/packages/features/vanguard/manifest.ts'
      - 'main/**/*'
      - '/packages/features/vanguard/main/**/*'
      - '/packages/features/sessions/main/**/*'
      - '/packages/features/sessions/manifest.ts'
      - '/packages/runtime/src/**/*'
      - '/packages/modules/vanguard/main/**/*'
      - '/packages/modules/vanguard/renderer/**/*'
      - '/packages/modules/vanguard/manifest.ts'
      - '/packages/modules/vault/main/**/*'
      - '/packages/modules/vault/manifest.ts'
      - '/packages/modules/cleaner/main/**/*'
      - '/packages/modules/cleaner/manifest.ts'
      - '/packages/modules/monitor/main/**/*'
      - '/packages/modules/monitor/manifest.ts'
      - '/packages/features/vault/main/**/*'
      - '/packages/features/vault/manifest.ts'
      - '/packages/features/optimizer/main/**/*'
      - '/packages/features/optimizer/manifest.ts'
      - '/packages/features/monitor/main/**/*'
      - '/packages/features/monitor/manifest.ts'
      - '/packages/git-engine/src/**/*'

  test:
    inputs:
      - 'src/**/*'
      - 'vitest.config.ts'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/bridge.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/vanguard/renderer/**/*'
      - '/packages/features/vanguard/manifest.ts'
      - 'main/**/*'
      - '/packages/features/vanguard/main/**/*'
      - '/packages/features/sessions/main/**/*'
      - '/packages/features/sessions/manifest.ts'
      - '/packages/runtime/src/**/*'
      - '/packages/modules/vanguard/main/**/*'
      - '/packages/modules/vanguard/renderer/**/*'
      - '/packages/modules/vanguard/manifest.ts'
      - '/packages/modules/vault/main/**/*'
      - '/packages/modules/vault/manifest.ts'
      - '/packages/modules/cleaner/main/**/*'
      - '/packages/modules/cleaner/manifest.ts'
      - '/packages/modules/monitor/main/**/*'
      - '/packages/modules/monitor/manifest.ts'
      - '/packages/features/vault/main/**/*'
      - '/packages/features/vault/manifest.ts'
      - '/packages/features/optimizer/main/**/*'
      - '/packages/features/optimizer/manifest.ts'
      - '/packages/features/monitor/main/**/*'
      - '/packages/features/monitor/manifest.ts'
      - '/packages/git-engine/src/**/*'
