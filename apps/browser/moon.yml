$schema: 'https://moonrepo.dev/schemas/project.json'

# Midnite Browser (Phase 113 Theme L) — the browser feature as its own app: full-window browsing, the web
# apps and agent-driven sessions over `packages/features/browser` + `packages/frame` + `shared`, composed
# in src/, with its own Electron main in main/.
# `resources/icon.icns` is what makes a release pack it (`moon run launcher:icons` writes it from the launcher's tile logo).
id: 'app-browser'
language: 'typescript'

tags:
  - 'layer-app'
  - 'app-browser'

dependsOn:
  - 'shared'
  - 'frame'
  - 'runtime'
  - 'feature-browser'
  - 'feature-report'
  - 'module-browser'

tasks:
  build:
    command: 'pnpm run build'
    options:
      mergeArgs: 'replace'
    deps:
      - 'root:install'
    inputs:
      - 'src/**/*'
      - 'main/**/*'
      - 'scripts/bundle-main.mjs'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/browser/renderer/**/*'
      - '/packages/features/browser/manifest.ts'
      - '/packages/features/browser/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/modules/browser/main/**/*'
      - '/packages/modules/browser/renderer/**/*'
      - '/packages/modules/browser/manifest.ts'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/report/bridge.ts'
    outputs:
      - 'dist'

  # The Browser bundle, gated (Phase 117 Theme A): `pnpm run dist` runs the Chromium floor first —
  # `electron-freshness.mjs --strict` fails on a launcher Electron major outside the supported window —
  # and only then the same build `release.yml` packs (a package script, not two moon deps, because moon
  # runs deps concurrently and the build must not start when the gate has already failed). The Browser
  # has no binary of its own (a stub clones the launcher's runtime), so the fuses are the launcher's
  # (`apps/launcher/scripts/afterpack.cjs`), not something this task can flip.
  dist:
    command: 'pnpm run dist'
    options:
      mergeArgs: 'replace'
      cache: false
    deps:
      - 'root:install'

  typecheck:
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tailwind.config.ts'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/browser/renderer/**/*'
      - '/packages/features/browser/manifest.ts'
      - 'main/**/*'
      - '/packages/features/browser/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/modules/browser/main/**/*'
      - '/packages/modules/browser/renderer/**/*'
      - '/packages/modules/browser/manifest.ts'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/report/bridge.ts'

  test:
    inputs:
      - 'src/**/*'
      - 'vitest.config.ts'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/browser/renderer/**/*'
      - '/packages/features/browser/manifest.ts'
      - 'main/**/*'
      - '/packages/features/browser/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/modules/browser/main/**/*'
      - '/packages/modules/browser/renderer/**/*'
      - '/packages/modules/browser/manifest.ts'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/report/bridge.ts'
