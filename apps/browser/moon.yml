$schema: 'https://moonrepo.dev/schemas/project.json'

# Midnite Browser (Phase 113 Theme L) — the browser feature as its own app: full-window browsing, the web
# apps and agent-driven sessions over `packages/features/browser` + `packages/frame` + `shared`, composed
# in src/, with its own Electron main in main/.
# `resources/icon.icns` is what makes a release pack it (`moon run launcher:icons` writes it from the launcher's tile logo).
id: 'app-browser'
language: 'typescript'

tags:
  - 'layer-app'
  - 'app-browser'

dependsOn:
  - 'shared'
  - 'frame'
  - 'runtime'
  - 'feature-browser'
  - 'feature-report'

tasks:
  build:
    command: 'pnpm run build'
    options:
      mergeArgs: 'replace'
    deps:
      - 'root:install'
    inputs:
      - 'src/**/*'
      - 'main/**/*'
      - 'scripts/bundle-main.mjs'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/browser/renderer/**/*'
      - '/packages/features/browser/manifest.ts'
      - '/packages/features/browser/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/report/bridge.ts'
    outputs:
      - 'dist'

  # The Browser bundle, gated (Phase 117 Theme A): the Chromium floor first — `root:electron-freshness-strict`
  # fails on an Electron major outside the supported window — then the same build `release.yml` packs.
  # The Browser has no binary of its own (a stub clones the launcher's runtime), so the fuses are the
  # launcher's (`apps/launcher/scripts/afterpack.cjs`), not something this task can flip.
  dist:
    command: 'noop'
    deps:
      - 'root:electron-freshness-strict'
      - '~:build'
    options:
      cache: false

  typecheck:
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tailwind.config.ts'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/browser/renderer/**/*'
      - '/packages/features/browser/manifest.ts'
      - 'main/**/*'
      - '/packages/features/browser/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/report/bridge.ts'

  test:
    inputs:
      - 'src/**/*'
      - 'vitest.config.ts'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/browser/renderer/**/*'
      - '/packages/features/browser/manifest.ts'
      - 'main/**/*'
      - '/packages/features/browser/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/report/bridge.ts'
