$schema: 'https://moonrepo.dev/schemas/project.json'

# Midnite Cleaner (Phase 113 Theme H1) — the first app that ships as its own bundle:
# `packages/features/optimizer` + `packages/frame` + `shared`, composed in src/.
# `resources/icon.icns` is what makes a release pack it (`moon run launcher:icons` writes it from the launcher's tile logo).
id: 'app-cleaner'
language: 'typescript'

tags:
  - 'layer-app'
  - 'app-cleaner'

dependsOn:
  - 'shared'
  - 'frame'
  - 'runtime'
  - 'feature-optimizer'
  - 'feature-report'

tasks:
  build:
    command: 'pnpm run build'
    options:
      mergeArgs: 'replace'
    deps:
      - 'root:install'
    inputs:
      - 'src/**/*'
      - 'main/**/*'
      - 'scripts/bundle-main.mjs'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/optimizer/renderer/**/*'
      - '/packages/features/optimizer/manifest.ts'
      - '/packages/features/optimizer/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/report/bridge.ts'
    outputs:
      - 'dist'

  typecheck:
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tailwind.config.ts'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/optimizer/renderer/**/*'
      - '/packages/features/optimizer/manifest.ts'
      - 'main/**/*'
      - '/packages/features/optimizer/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/report/bridge.ts'

  test:
    inputs:
      - 'src/**/*'
      - 'vitest.config.ts'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/optimizer/renderer/**/*'
      - '/packages/features/optimizer/manifest.ts'
      - 'main/**/*'
      - '/packages/features/optimizer/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/report/bridge.ts'
