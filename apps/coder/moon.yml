$schema: 'https://moonrepo.dev/schemas/project.json'

# Midnite Coder (Phase 113 Theme O) — the forge (Reviews, Actions), Tests, the API client, the
# Database tool, Sessions and Tasks as their own app: `packages/features/{forge,tests,api-client,database,sessions,tasks}` +
# `packages/frame` + `shared`, composed in src/.
# `resources/icon.icns` is what makes a release pack it (`moon run launcher:icons` writes it from the launcher's tile logo).
id: 'app-coder'
language: 'typescript'

tags:
  - 'layer-app'
  - 'app-coder'

dependsOn:
  - 'shared'
  - 'frame'
  - 'runtime'
  - 'git-engine'
  - 'db-engine'
  - 'feature-forge'
  - 'feature-tests'
  - 'feature-api-client'
  - 'feature-database'
  - 'feature-sessions'
  - 'feature-tasks'

tasks:
  build:
    command: 'pnpm run build'
    options:
      mergeArgs: 'replace'
    deps:
      - 'root:install'
    inputs:
      - 'src/**/*'
      - 'main/**/*'
      - 'scripts/bundle-main.mjs'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/forge/renderer/**/*'
      - '/packages/features/forge/manifest.ts'
      - '/packages/features/tests/renderer/**/*'
      - '/packages/features/tests/manifest.ts'
      - '/packages/features/api-client/renderer/**/*'
      - '/packages/features/api-client/manifest.ts'
      - '/packages/features/database/renderer/**/*'
      - '/packages/features/database/manifest.ts'
      - '/packages/features/sessions/renderer/**/*'
      - '/packages/features/sessions/manifest.ts'
      - '/packages/features/tasks/renderer/**/*'
      - '/packages/features/tasks/manifest.ts'
      - '/packages/features/forge/main/**/*'
      - '/packages/features/tests/main/**/*'
      - '/packages/features/api-client/main/**/*'
      - '/packages/features/database/main/**/*'
      - '/packages/features/sessions/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/git-engine/src/**/*'
      - '/packages/db-engine/src/**/*'
    outputs:
      - 'dist'

  typecheck:
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tailwind.config.ts'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/forge/renderer/**/*'
      - '/packages/features/forge/manifest.ts'
      - '/packages/features/tests/renderer/**/*'
      - '/packages/features/tests/manifest.ts'
      - '/packages/features/api-client/renderer/**/*'
      - '/packages/features/api-client/manifest.ts'
      - '/packages/features/database/renderer/**/*'
      - '/packages/features/database/manifest.ts'
      - '/packages/features/sessions/renderer/**/*'
      - '/packages/features/sessions/manifest.ts'
      - '/packages/features/tasks/renderer/**/*'
      - '/packages/features/tasks/manifest.ts'
      - 'main/**/*'
      - '/packages/features/forge/main/**/*'
      - '/packages/features/tests/main/**/*'
      - '/packages/features/api-client/main/**/*'
      - '/packages/features/database/main/**/*'
      - '/packages/features/sessions/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/git-engine/src/**/*'
      - '/packages/db-engine/src/**/*'

  test:
    inputs:
      - 'src/**/*'
      - 'vitest.config.ts'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/forge/renderer/**/*'
      - '/packages/features/forge/manifest.ts'
      - '/packages/features/tests/renderer/**/*'
      - '/packages/features/tests/manifest.ts'
      - '/packages/features/api-client/renderer/**/*'
      - '/packages/features/api-client/manifest.ts'
      - '/packages/features/database/renderer/**/*'
      - '/packages/features/database/manifest.ts'
      - '/packages/features/sessions/renderer/**/*'
      - '/packages/features/sessions/manifest.ts'
      - '/packages/features/tasks/renderer/**/*'
      - '/packages/features/tasks/manifest.ts'
      - 'main/**/*'
      - '/packages/features/forge/main/**/*'
      - '/packages/features/tests/main/**/*'
      - '/packages/features/api-client/main/**/*'
      - '/packages/features/database/main/**/*'
      - '/packages/features/sessions/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/git-engine/src/**/*'
      - '/packages/db-engine/src/**/*'
