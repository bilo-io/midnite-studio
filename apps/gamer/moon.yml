$schema: 'https://moonrepo.dev/schemas/project.json'

# Midnite Gamer (Phase 113 Theme S) — media-core + the Maps, Terrain, Sprites, Models and Games tab features +
# `packages/frame` + `shared`, composed in src/ and main/.
# `resources/icon.icns` is what makes a release pack it (`moon run launcher:icons` writes it from the launcher's tile logo).
id: 'app-gamer'
language: 'typescript'

tags:
  - 'layer-app'
  - 'app-gamer'

dependsOn:
  - 'shared'
  - 'frame'
  - 'runtime'
  - 'feature-report'
  - 'git-engine'
  - 'feature-media-core'
  - 'feature-media-map'
  - 'feature-media-terrain'
  - 'feature-media-sprite'
  - 'feature-media-model'
  - 'feature-media-game'
  # Main halves used as libraries, never as tabs: the Images providers behind Sprites' and Terrain's image
  # generation, and the Models feature's Ollama client behind the Model tab's engine.
  - 'feature-media-images'
  - 'feature-models'

tasks:
  build:
    command: 'pnpm run build'
    options:
      mergeArgs: 'replace'
    deps:
      - 'root:install'
    inputs:
      - 'src/**/*'
      - 'main/**/*'
      - 'scripts/bundle-main.mjs'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/bridge.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/git-engine/src/**/*'
      - '/packages/features/media-core/renderer/**/*'
      - '/packages/features/media-core/manifest.ts'
      - '/packages/features/media-core/main/**/*'
      - '/packages/features/media-map/renderer/**/*'
      - '/packages/features/media-map/manifest.ts'
      - '/packages/features/media-map/main/**/*'
      - '/packages/features/media-terrain/renderer/**/*'
      - '/packages/features/media-terrain/manifest.ts'
      - '/packages/features/media-terrain/main/**/*'
      - '/packages/features/media-sprite/renderer/**/*'
      - '/packages/features/media-sprite/manifest.ts'
      - '/packages/features/media-sprite/main/**/*'
      - '/packages/features/media-model/renderer/**/*'
      - '/packages/features/media-model/manifest.ts'
      - '/packages/features/media-model/main/**/*'
      - '/packages/features/media-images/main/**/*'
      - '/packages/features/media-images/manifest.ts'
      - '/packages/features/models/main/**/*'
      - '/packages/features/models/manifest.ts'
      - '/packages/features/media-game/renderer/**/*'
      - '/packages/features/media-game/manifest.ts'
      - '/packages/features/media-game/main/**/*'
      - '/templates/media-game/**/*'
    outputs:
      - 'dist'

  typecheck:
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tailwind.config.ts'
      - 'main/**/*'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/bridge.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/git-engine/src/**/*'
      - '/packages/features/media-core/renderer/**/*'
      - '/packages/features/media-core/manifest.ts'
      - '/packages/features/media-core/main/**/*'
      - '/packages/features/media-map/renderer/**/*'
      - '/packages/features/media-map/manifest.ts'
      - '/packages/features/media-map/main/**/*'
      - '/packages/features/media-terrain/renderer/**/*'
      - '/packages/features/media-terrain/manifest.ts'
      - '/packages/features/media-terrain/main/**/*'
      - '/packages/features/media-sprite/renderer/**/*'
      - '/packages/features/media-sprite/manifest.ts'
      - '/packages/features/media-sprite/main/**/*'
      - '/packages/features/media-model/renderer/**/*'
      - '/packages/features/media-model/manifest.ts'
      - '/packages/features/media-model/main/**/*'
      - '/packages/features/media-images/main/**/*'
      - '/packages/features/media-images/manifest.ts'
      - '/packages/features/models/main/**/*'
      - '/packages/features/models/manifest.ts'
      - '/packages/features/media-game/renderer/**/*'
      - '/packages/features/media-game/manifest.ts'
      - '/packages/features/media-game/main/**/*'

  test:
    inputs:
      - 'src/**/*'
      - 'main/**/*'
      - 'vitest.config.ts'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/bridge.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/git-engine/src/**/*'
      - '/packages/features/media-core/renderer/**/*'
      - '/packages/features/media-core/manifest.ts'
      - '/packages/features/media-core/main/**/*'
      - '/packages/features/media-map/renderer/**/*'
      - '/packages/features/media-map/manifest.ts'
      - '/packages/features/media-map/main/**/*'
      - '/packages/features/media-terrain/renderer/**/*'
      - '/packages/features/media-terrain/manifest.ts'
      - '/packages/features/media-terrain/main/**/*'
      - '/packages/features/media-sprite/renderer/**/*'
      - '/packages/features/media-sprite/manifest.ts'
      - '/packages/features/media-sprite/main/**/*'
      - '/packages/features/media-model/renderer/**/*'
      - '/packages/features/media-model/manifest.ts'
      - '/packages/features/media-model/main/**/*'
      - '/packages/features/media-images/main/**/*'
      - '/packages/features/media-images/manifest.ts'
      - '/packages/features/models/main/**/*'
      - '/packages/features/models/manifest.ts'
      - '/packages/features/media-game/renderer/**/*'
      - '/packages/features/media-game/manifest.ts'
      - '/packages/features/media-game/main/**/*'
