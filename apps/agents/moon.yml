$schema: 'https://moonrepo.dev/schemas/project.json'

# Midnite Agents (Phase 113 Theme N) — chats, councils, workflows (Graphs), models and the MCP Tools view as their own app:
# `packages/features/{chats,councils,workflows,models,mcp-tools}` + `packages/frame` + `shared`, composed in src/.
# `resources/icon.icns` is what makes a release pack it (`moon run launcher:icons` writes it from the launcher's tile logo).
id: 'app-agents'
language: 'typescript'

tags:
  - 'layer-app'
  - 'app-agents'

dependsOn:
  - 'shared'
  - 'frame'
  - 'runtime'
  - 'feature-chats'
  - 'feature-councils'
  - 'feature-models'
  - 'feature-workflows'
  - 'feature-mcp-tools'
  # Their manifests only: Audio owns the `music_*` tools (Creator's) and Game, Map, Model, Sprite and Terrain
  # the Gamer ones, which the Tools view needs to know belong to apps that are not installed here.
  - 'feature-media-audio'
  - 'feature-media-game'
  - 'feature-media-map'
  - 'feature-media-model'
  - 'feature-media-sprite'
  - 'feature-media-terrain'
  - 'module-agents'

tasks:
  build:
    command: 'pnpm run build'
    options:
      mergeArgs: 'replace'
    deps:
      - 'root:install'
    inputs:
      - 'src/**/*'
      - 'main/**/*'
      - 'scripts/bundle-main.mjs'
      - 'vite.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/chats/renderer/**/*'
      - '/packages/features/chats/manifest.ts'
      - '/packages/features/councils/renderer/**/*'
      - '/packages/features/councils/manifest.ts'
      - '/packages/features/models/renderer/**/*'
      - '/packages/features/workflows/renderer/**/*'
      - '/packages/features/mcp-tools/renderer/**/*'
      - '/packages/features/models/manifest.ts'
      - '/packages/features/workflows/manifest.ts'
      - '/packages/features/mcp-tools/manifest.ts'
      - '/packages/features/media-audio/manifest.ts'
      - '/packages/features/media-game/manifest.ts'
      - '/packages/features/media-map/manifest.ts'
      - '/packages/features/media-model/manifest.ts'
      - '/packages/features/media-sprite/manifest.ts'
      - '/packages/features/media-terrain/manifest.ts'
      - '/packages/features/chats/main/**/*'
      - '/packages/features/councils/main/**/*'
      - '/packages/features/models/main/**/*'
      - '/packages/features/workflows/main/**/*'
      - '/packages/features/mcp-tools/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/modules/agents/main/**/*'
      - '/packages/modules/agents/renderer/**/*'
      - '/packages/modules/agents/manifest.ts'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/report/bridge.ts'
    outputs:
      - 'dist'

  typecheck:
    inputs:
      - '@group(sources)'
      - '@group(configs)'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'tailwind.config.ts'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/chats/renderer/**/*'
      - '/packages/features/chats/manifest.ts'
      - '/packages/features/councils/renderer/**/*'
      - '/packages/features/councils/manifest.ts'
      - '/packages/features/models/renderer/**/*'
      - '/packages/features/workflows/renderer/**/*'
      - '/packages/features/mcp-tools/renderer/**/*'
      - '/packages/features/models/manifest.ts'
      - '/packages/features/workflows/manifest.ts'
      - '/packages/features/mcp-tools/manifest.ts'
      - '/packages/features/media-audio/manifest.ts'
      - '/packages/features/media-game/manifest.ts'
      - '/packages/features/media-map/manifest.ts'
      - '/packages/features/media-model/manifest.ts'
      - '/packages/features/media-sprite/manifest.ts'
      - '/packages/features/media-terrain/manifest.ts'
      - 'main/**/*'
      - '/packages/features/chats/main/**/*'
      - '/packages/features/councils/main/**/*'
      - '/packages/features/models/main/**/*'
      - '/packages/features/workflows/main/**/*'
      - '/packages/features/mcp-tools/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/modules/agents/main/**/*'
      - '/packages/modules/agents/renderer/**/*'
      - '/packages/modules/agents/manifest.ts'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/report/bridge.ts'

  test:
    inputs:
      - 'src/**/*'
      - 'vitest.config.ts'
      - 'package.json'
      - '/packages/shared/src/**/*'
      - '/packages/frame/src/**/*'
      - '/packages/features/chats/renderer/**/*'
      - '/packages/features/chats/manifest.ts'
      - '/packages/features/councils/renderer/**/*'
      - '/packages/features/councils/manifest.ts'
      - '/packages/features/models/renderer/**/*'
      - '/packages/features/workflows/renderer/**/*'
      - '/packages/features/mcp-tools/renderer/**/*'
      - '/packages/features/models/manifest.ts'
      - '/packages/features/workflows/manifest.ts'
      - '/packages/features/mcp-tools/manifest.ts'
      - '/packages/features/media-audio/manifest.ts'
      - '/packages/features/media-game/manifest.ts'
      - '/packages/features/media-map/manifest.ts'
      - '/packages/features/media-model/manifest.ts'
      - '/packages/features/media-sprite/manifest.ts'
      - '/packages/features/media-terrain/manifest.ts'
      - 'main/**/*'
      - '/packages/features/chats/main/**/*'
      - '/packages/features/councils/main/**/*'
      - '/packages/features/models/main/**/*'
      - '/packages/features/workflows/main/**/*'
      - '/packages/features/mcp-tools/main/**/*'
      - '/packages/runtime/src/**/*'
      - '/packages/modules/agents/main/**/*'
      - '/packages/modules/agents/renderer/**/*'
      - '/packages/modules/agents/manifest.ts'
      - '/packages/features/report/renderer/**/*'
      - '/packages/features/report/manifest.ts'
      - '/packages/features/report/main/**/*'
      - '/packages/features/report/bridge.ts'
