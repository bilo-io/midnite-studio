$schema: 'https://moonrepo.dev/schemas/project.json'

# The workspace-root project. It exists only to host repo-wide tasks; it has no
# TypeScript sources of its own, so opt out of the inherited build/typecheck/
# lint tasks (`.moon/tasks/typescript.yml`). `language: 'bash'` is NOT enough on
# its own — moon 2 applies every `.moon/tasks/*.yml` to every project regardless
# of the filename, so the exclusion has to be explicit.
#
# `test` is deliberately NOT excluded (Phase 53 Theme F): the repo-wide
# `scripts/*.test.mjs` files existed with no runner behind them, so `moon run
# :test` skipped the root project entirely and CI never executed the guards over
# version-check, tracker-check and the changelog mirror. `vitest.config.ts` at
# the root scopes the inherited task to exactly those files.
id: 'root'
language: 'bash'
layer: 'tool'

workspace:
  inheritedTasks:
    exclude:
      - 'build'
      - 'typecheck'
      - 'lint'

tasks:
  # install: ensure workspace deps are up to date before build/dev. Runs once at
  # the workspace root — a pnpm workspace install covers all packages. Never
  # cached (pnpm does its own up-to-date check in ~1s). It stays CI-enabled
  # because `build` depends on it and moon rejects a CI-disabled dependency of a
  # CI task; in CI it's a no-op after the workflow's `--frozen-lockfile` install.
  install:
    command: 'pnpm install'
    options:
      cache: false

  # tracker-check: verifies phase doc and _INDEX.md consistency across 7 rules.
  tracker-check:
    command: 'node scripts/tracker-check.mjs'
    options:
      cache: false

  # version-check: assert the lockstep invariant — the root package.json and
  # every packages/*/package.json share one MAJOR.MINOR (PATCH may diverge per
  # package). Pure static check — no build deps, no network, import-free
  # (scripts/version-check.mjs never imports @midnite/*) — so it runs in CI
  # before (and independently of) anything else, exactly like tracker-check
  # above (Phase 53 Theme B).
  version-check:
    command: 'node scripts/version-check.mjs'
    inputs:
      - 'scripts/version-check.mjs'
      - 'package.json'
      - 'packages/*/package.json'
    options:
      cache: false

  # audit (Phase 91 Theme I): `pnpm audit` for high/critical advisories, filtered
  # through scripts/audit-suppressions.json whose entries expire. Needs the npm
  # registry, not an install. No `inputs`, same as the other on-disk-state tasks.
  audit:
    command: 'node scripts/audit.mjs'
    options:
      cache: false

  # electron-freshness (Phase 91 Theme I): warns, never fails, when a pinned Electron
  # major (Studio's, the launcher's) is outside the supported three.
  electron-freshness:
    command: 'node scripts/electron-freshness.mjs'
    options:
      cache: false

  # electron-freshness-strict (Phase 117 Theme A): the same check as a gate — exits 1 when the
  # launcher's pin (the runtime every app bundle runs on) is outside the window; Studio's stays a
  # warning. `app-browser:dist` and release.yml's Browser bundle job run it: a browser cannot ship on
  # a Chromium with no security backports. A network failure still skips with a notice, never a failure.
  electron-freshness-strict:
    command: 'node scripts/electron-freshness.mjs --strict'
    options:
      cache: false

  # affected-apps (Phase 113 Theme C): print the app ids a change reaches —
  # moon's affected projects (downstream deep) mapped through their `app-*`
  # moon tags. Defaults to origin/main...HEAD; pass `-- --base <rev>` to move
  # the base, `-- --json` for the project list too. Not a gate: Theme F's
  # affected-only bundle builds are its consumer.
  affected-apps:
    command: 'node scripts/affected-apps.mjs'
    options:
      cache: false
      runInCI: false

  # gate-projects-check: assert every packages/* directory is claimed by
  # exactly one of the two split gate jobs in .github/workflows/ci.yml
  # (Phase 82 Theme E) — a project that lands in neither `gate-node` nor
  # `gate-native`'s explicit target list would otherwise silently stop being
  # typechecked/linted/tested in CI. Depends on `packages/*` existing, same
  # shape as version-check above.
  gate-projects-check:
    command: 'node scripts/gate-projects-check.mjs'
    inputs:
      - 'scripts/gate-projects-check.mjs'
      - 'packages/*/package.json'
      - 'packages/features/*/package.json'
    options:
      cache: false

  # visual-budget: cap the pixel-diff layer's committed baseline corpus at the
  # ~100 PNG / ~3 MB limit Phase 82 Theme D settled on, so it cannot silently
  # regrow into the same problem docs/screenshots/ already is. `cache: false`
  # and no declared `inputs` — like tracker-check above, this reads
  # `packages/app/e2e/visual/__screenshots__/` directly rather than through
  # moon's hash, since what it is checking IS the state of that directory on
  # disk, not a build output derived from it.
  visual-budget:
    command: 'node scripts/visual-budget.mjs'
    options:
      cache: false

  # visual-regen: regenerate the committed Linux visual baselines inside the
  # official Playwright container. The ONE task in this repo that starts a
  # container, and it is opt-in by construction — `scripts/visual-regen.mjs`
  # refuses without `MSTUDIO_CROSS_PLATFORM=1`, because macOS (arm64) is the
  # only officially supported platform for now and the Linux baselines are
  # deferred scope. It exists as a task rather than a comment so it is
  # discoverable (`moon query tasks`) instead of being copy-pasted out of
  # `packages/app/playwright.visual.config.ts`'s header.
  #
  # `runInCI: false` — CI's own `visual` job IS the container, so it has no use
  # for a task that starts one. `cache: false` and no `inputs` for the same
  # reason `visual-budget` above has none: what it operates on is the state of
  # `packages/app/e2e/visual/__screenshots__/` on disk, not a derived output.
  visual-regen:
    command: 'node scripts/visual-regen.mjs'
    options:
      cache: false
      runInCI: false

  # e2e-budget: enforce the righted test pyramid (Phase 82 Theme F) — fails if
  # declared functional E2E tests exceed the committed ratchet cap, if the
  # visual baseline corpus exceeds its cap, or if unit tests assert wall-clock
  # duration bounds.
  e2e-budget:
    command: 'node scripts/e2e-budget.mjs'
    options:
      cache: false

  # test-node (Phase 116 Theme A): workspace-level Vitest multi-project run
  # covering all 35 node-portable packages plus scripts/**/*.test.mjs in a single
  # shared process pool, cutting gate-node from 35 cold Vite boots to 1.
  test-node:
    command: 'pnpm exec vitest run --config vitest.node-gate.config.ts'
    options:
      cache: false

  # lint-all (Phase 116 Theme A): single-pass eslint across the entire workspace
  # with persistent caching, replacing 36 sequential eslint invocations.
  lint-all:
    command: 'pnpm exec eslint . --cache --cache-location .moon/cache/eslint/'
    options:
      cache: false

  # typecheck-node (Phase 116 Theme A): batched parallel tsc --noEmit runner
  # covering the 36 node-portable packages without moon's 36-task spawn tax.
  typecheck-node:
    command: 'node scripts/typecheck-node.mjs'
    options:
      cache: false

